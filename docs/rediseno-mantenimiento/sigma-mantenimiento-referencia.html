.mon-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.at{border-radius:18px;background:var(--m-card);box-shadow:inset 0 0 0 1px var(--m-line);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;min-width:0;animation:mrise .35s ease-out both;position:relative;overflow:hidden}

.at.m-att{--acc:var(--m-red);box-shadow:inset 0 0 0 1px rgba(255,107,125,.4)}

.at-a,.at-w{min-width:0}

.cmp{color:#C9BDFF}
.pz{color:var(--m-amb);font-weight:700}

.at-more{border:0;background:transparent;color:var(--m-pur);font-size:12px;font-weight:700;padding:6px;align-self:flex-start}
.mon-e{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:30px 16px;border-radius:18px;background:var(--m-card);box-shadow:inset 0 0 0 1px var(--m-line);color:var(--m-mut);font-size:13px}
.mon-e .ic{color:var(--m-grn)}
.mon-e b{color:var(--m-ink);font-size:15px}
.mon-e.light{background:var(--surface-2);box-shadow:none;color:var(--muted)}
.mon-e.light b{color:var(--ink)}
.mon-q{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--m-mut)}

.otree li:hover .oa,.otree li:focus-within .oa{opacity:1}
.otree li:has(.oa) em{margin-left:6px}
.oa .btn.xs{height:26px;padding:0 7px;font-size:11.5px}
@media (hover:none){.oa{opacity:1;width:100%;margin-left:22px}}
/* SIGMA AI · identidad propia (superficie oscura, marca y acentos neón) */
.sai{position:relative;overflow:hidden;border-radius:16px;padding:14px 16px;background:#070B16;color:#F4F6FF;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 1px rgba(148,163,214,.16),0 10px 28px rgba(7,11,22,.25);isolation:isolate}
.sai::before{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(148,163,214,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,214,.07) 1px,transparent 1px);background-size:24px 24px}
.sai::after{content:'';position:absolute;right:-60px;top:-60px;width:180px;height:180px;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(108,92,255,.28),transparent 70%)}
.sai-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sai-w{display:block;height:13px;width:auto}
.sai-k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#B7BED6}
.sai-sym,.sai-rec{display:inline-block;flex:none;vertical-align:-3px}
.sai-p2{margin-left:auto;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:rgba(255,92,138,.16);color:#FF5C8A;box-shadow:inset 0 0 0 1px rgba(255,92,138,.35)}
.sai p{font-size:13px;line-height:1.5;color:#F4F6FF}
.sai small{font-size:11.5px;color:#7E87A6}
.sai-a{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.sai .btn.plain{background:transparent;color:#B7BED6}
.sai .btn.plain:hover{background:rgba(255,255,255,.06);color:#fff}
.sai .btn.out{background:transparent;color:#00E0C2;border-color:rgba(0,224,194,.5)}
.sai .btn.out:hover{background:rgba(0,224,194,.1)}
.sai-st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#B7BED6;margin-left:auto}
.sai-lg{padding:18px 20px;gap:14px}
.sai-lg .aiw{grid-template-columns:120px minmax(0,1fr)}
.sai-lg .ey2{color:#00E0C2}
.sai-lg h4{color:#fff}
.sai-lg .otd{color:#D3D8E8}
.sai-lg .blk{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(148,163,214,.14)}
.sai-lg .blk-h h4{color:#B7BED6}
.sai-lg .olst{color:#F4F6FF}
.sai-lg .lnk{color:#00E0C2}
.sai-foot{font-size:11.5px !important;color:#7E87A6 !important}
.org.o-pred{background:#070B16;color:#F4F6FF;box-shadow:inset 0 0 0 1px rgba(108,92,255,.45);gap:5px;padding:2px 9px 2px 6px}
.org.o-pred .sai-sym{width:13px;height:13px}
.org.o-pred b{color:#00E0C2}
.sai-conf{font-size:11px;font-weight:700;color:#5A4BE0;background:#EFEDFF;padding:2px 8px;border-radius:999px}
.avr.o-pred .av-bar{background:linear-gradient(#00E0C2,#6C5CFF 55%,#FF4D9D)}
.avs-i.ai{background:#070B16;color:#F4F6FF;box-shadow:inset 0 0 0 1px rgba(108,92,255,.45)}
.avs-i.ai b{color:#fff}
.avs-i.ai.on{box-shadow:0 0 0 2px #6C5CFF}
@media (max-width:640px){.sai-lg .aiw{grid-template-columns:minmax(0,1fr)}.rte li{grid-template-columns:26px minmax(0,1fr) auto}.rte li > .crit{display:none}.rte li > .rte-a{grid-column:3}}
.facts .objv .objt{display:block;font-size:13.5px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
.facts .objv .objk{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--sigma-cyan-soft);color:var(--sigma-cyan-dark);letter-spacing:.04em}
.facts .objv .objt small{margin-top:1px}

/* v7 · repuestos planificados con compatibilidades */
.fld .lb small{font-weight:500;color:var(--muted);margin-left:4px;text-transform:none;letter-spacing:0}
.reps2{display:flex;flex-direction:column;gap:8px}
.rp2{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,150px) auto 32px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line3)}
.rp2 .s{min-width:0}
.rp2 .s b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp2 .s small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.rp2 code,.rc code{font-size:11px;color:var(--muted)}
.rp2-q{display:flex;align-items:center;gap:6px}
.rp2-q .inp{height:32px;width:72px}
.rp2-q .un{font-size:12px;color:var(--muted)}
.rp2-t{font-size:12px;color:var(--ink-2)}
.cpt{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;white-space:nowrap}
.cpt.c-ok{background:#E7F5EE;color:var(--ok-ink)} .cpt.c-pt{background:var(--sigma-cyan-soft);color:var(--sigma-cyan-dark)} .cpt.c-no{background:var(--amber-soft);color:var(--amber)}
.stk{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.stk.s-ok{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line3)} .stk.s-lo{background:var(--amber-soft);color:var(--amber)} .stk.s-0{background:var(--red-soft);color:var(--red)} .stk.s-na{background:var(--chip);color:var(--muted)}
.rpc{border-radius:14px;padding:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line3);display:flex;flex-direction:column;gap:10px}
.rpc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rpc-t{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.rpc-t .ic{color:var(--sigma-cyan-dark)}
.rpc-h .lnk{margin-left:auto;font-size:12.5px}
.rpc-sc{display:flex;gap:6px;flex-wrap:wrap}
.rpc-sc .tg{background:#fff;box-shadow:inset 0 0 0 1px var(--line3)}
.rpc-q{height:34px;max-width:320px;background:#fff}
.rc-g{display:flex;flex-direction:column;gap:4px}
.rc-gh{display:flex;align-items:baseline;gap:8px;padding:2px 2px 2px}
.rc-gh b{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.rc-gh small{font-size:11.5px;color:var(--muted)}
.rc{display:grid;grid-template-columns:minmax(0,1fr) auto auto 86px 96px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#fff}
.rc.on{background:#F3FBF7}
.rc .s{min-width:0}
.rc .s b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .s small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-q{font-size:12.5px;font-weight:700;text-align:right}
.rc-q small{font-weight:500;color:var(--muted)}
.rc .btn{justify-self:end}
.rc-ok{display:inline-flex;align-items:center;gap:4px;justify-self:end;font-size:12px;font-weight:700;color:var(--ok-ink)}
.rpc-more{align-self:flex-start;font-size:12.5px}
.rpc-e{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:4px 2px}
.rpc-cat{height:34px;max-width:420px}
@media (max-width:900px){.rp2{grid-template-columns:minmax(0,1fr) auto 32px}.rp2 .s{grid-column:1/-1}.rp2-t{grid-column:1/3}.rc{grid-template-columns:minmax(0,1fr) auto}.rc .s{grid-column:1/-1}.rc-f,.rc-q{display:none}}

.nb.g{background:rgba(255,255,255,.1);color:#D3D8E8}
body.enlarged .side.v2 .nb.g{background:#C9CFE0}
[hidden]{display:none!important}
</style>

  };
}
function curStep(p, info) {
  if (U.step[p.id]) return U.step[p.id];

  return [1, 2, 3].find(k => info.err(k).length) || 5;

const step5Name = p => p.st === 'draft' ? 'Activar' : p.st === 'changes' ? 'Aplicar' : 'Resumen';
function nextLabel(p, i) {

  const d = nextDates(f, 6).find(x => !x.x); return d ? fDL(d.d) : '';
}

    : p.st === 'inactive' ? `<div class="bnr i">${ic('alert', 18)}<span><b>Plan inactivo:</b> no genera ejecuciones. Motivo: ${esc2(p.motivo)} — ${esc2(p.offBy)}</span></div>`
    : st.venc + st.atr ? `<div class="bnr w">${ic('alert', 18)}<span><b>${pl(st.venc + st.atr, 'ejecución vencida o atrasada', 'ejecuciones vencidas o atrasadas')}</b> sin orden de trabajo.</span><span class="r"><button type="button" class="btn sec xs" data-a="tab" data-t="ejec" data-fp="${p.id}" data-ff="att">Revisar y generar OT</button></span></div>` : '';
  const bar = [1, 2, 3, 4, 5].map(n => {
    const e = info.err(n).length, w = n === 5 ? 0 : info.warn(n).length, seen = U.vp[p.id] || p.st !== 'draft' || (U.vis[p.id].has(n) && n !== k);
    const state = n === k ? 'cur' : seen && e ? 'err' : info.done[n] && !e ? (w && n === 4 ? 'wa' : 'ok') : '';
    const c = state === 'ok' ? ic('check', 15) : state === 'err' ? '!' : n;

function s4HTML(p, E) {
  if (!p.ints.length) return `<div class="empty big"><span class="ei">${ic('users', 22)}</span><b>Primero define el trabajo</b><span>El responsable se asigna a cada intervención.</span><button type="button" class="btn out" data-a="stp" data-v="2">${chL(15)}Ir a Trabajo</button></div>`;

function whenHTML(p, i, E) {
  const f = i.f, sh = i.sh && shared(i.sh), code = i.code, b = k => `f:${code}.${k}`;
  if (!f && !sh) return `<div class="blk${U.vp[p.id] ? ' err' : ''}" id="when-${code}"><div class="blk-h"><h4>Elige cómo se repite</h4></div><div style="display:flex;flex-direction:column;gap:10px">${U.vp[p.id] ? mc('', 'Esta intervención necesita una frecuencia para poder activarse.') : mc('i', 'Calendario sirve para la mayoría de los casos: «cada mes, el día 15».', 'help')}<div class="segc" role="group" aria-label="Tipo de frecuencia">${[['cal', 'Calendario'], ['int', 'Intervalo'], ['fec', 'Fechas puntuales'], ['med', 'Por medidor'], ['cond', 'Por condición']].map(([k, l]) => `<button type="button" data-a="ftype" data-i="${code}" data-v="${k}" ${E ? '' : 'disabled'}>${l}</button>`).join('')}</div>${E ? `<button type="button" class="lnk" data-a="useshared" data-i="${code}">${ic('link', 14)}O usar un calendario compartido de la Biblioteca</button>` : ''}</div></div>`;
  if (sh) { const u = sh.uses; return `<div class="blk" id="when-${code}"><div class="blk-h"><h4>Cuándo</h4></div><div class="fq-ed"><div class="fq-f"><div class="shrd"><span class="kpb p" style="padding:0;box-shadow:none;background:none"><span class="i">${ic('link', 18)}</span></span><div style="flex:1;min-width:0"><b style="font-size:13px">Calendario compartido «${esc2(sh.n)}»</b><div style="font-size:12px;color:var(--muted)">${sh.id} · usado por ${u.plans.length} ${u.plans.length === 1 ? 'plan' : 'planes'}, ${u.tareas.length} ${u.tareas.length === 1 ? 'tarea' : 'tareas'} y ${u.pautas.length} ${u.pautas.length === 1 ? 'pauta' : 'pautas'}</div></div></div>
    ${mc('i', 'Es de solo lectura aquí. Si lo cambias en la Biblioteca, cambia para todos los que lo usan.')}
    ${E ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn out xs" data-a="libcal" data-c="${sh.id}">Editar en Biblioteca</button><button type="button" class="btn ghost xs" data-a="ownfreq" data-i="${code}">Convertir en propia</button></div>` : ''}</div>${pvHTML(p, i)}</div></div>`; }
  const dis = E ? '' : 'disabled';
  const seg = (k, opts) => `<div class="segc" role="group">${opts.map(([v, l]) => `<button type="button" data-a="fset" data-b="${b(k)}" data-v="${v}" aria-pressed="${String(f[k]) === String(v)}" ${dis}>${l}</button>`).join('')}</div>`;
  const hours = Array.from({ length: 48 }, (_, k) => `${pad(Math.floor(k / 2))}:${k % 2 ? '30' : '00'}`);
  const hourSel = `<div class="fld"><label>Hora</label><select class="sel" data-b="${b('hour')}" ${dis}>${hours.map(h => `<option${f.hour === h ? ' selected' : ''}>${h}</option>`).join('')}</select></div>`;
  let body = '';
  if (f.t === 'cal') {
    const unit = { d: f.n == 1 ? 'día' : 'días', w: f.n == 1 ? 'semana' : 'semanas', m: f.n == 1 ? 'mes' : 'meses', y: f.n == 1 ? 'año' : 'años' }[f.rep];
    body = `<div class="fld"><span class="lb">Se repite</span>${seg('rep', [['d', 'Diaria'], ['w', 'Semanal'], ['m', 'Mensual'], ['y', 'Anual']])}</div>
      <div class="grid3c"><div class="fld"><label>Cada</label><div class="unit"><input class="inp" type="number" min="1" data-b="${b('n')}" data-ty="int" value="${f.n}" ${dis}><span class="u">${unit}</span></div></div>${hourSel}<div></div></div>
      ${f.rep === 'w' ? `<div class="fld"><span class="lb">Días</span><div class="days">${[1, 2, 3, 4, 5, 6, 7].map(d => `<button type="button" data-a="fday" data-i="${code}" data-v="${d}" aria-pressed="${(f.days || []).includes(d)}" ${dis} aria-label="${DIA[d]}">${DIAC[d]}</button>`).join('')}</div>${(f.days || []).length ? '' : mc('', 'Elige al menos un día de la semana.')}</div>` : ''}
      ${f.rep === 'm' ? `<div class="fld"><span class="lb">Qué día del mes</span>${seg('mmode', [['day', 'Un día fijo'], ['ord', 'Un día de la semana']])}</div>
        ${f.mmode === 'ord' ? `<div class="grid3c"><div class="fld"><label>Semana</label><select class="sel" data-b="${b('ord')}" data-ty="int" ${dis}>${[[1, 'Primer'], [2, 'Segundo'], [3, 'Tercer'], [4, 'Cuarto'], [-1, 'Último']].map(([v, l]) => `<option value="${v}"${+f.ord === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div><div class="fld"><label>Día</label><select class="sel" data-b="${b('wd')}" data-ty="int" ${dis}>${[1, 2, 3, 4, 5, 6, 7].map(d => `<option value="${d}"${+f.wd === d ? ' selected' : ''}>${DIA[d]}</option>`).join('')}</select></div></div>`
          : `<div class="grid3c"><div class="fld"><label>Día del mes</label><select class="sel" data-b="${b('md')}" data-ty="int" ${dis}>${Array.from({ length: 31 }, (_, k) => `<option value="${k + 1}"${+f.md === k + 1 ? ' selected' : ''}>${k + 1}</option>`).join('')}</select>${+f.md > 28 ? mc('i', 'En los meses más cortos se usa el último día.') : ''}</div></div>`}` : ''}
      ${f.rep === 'y' ? `<div class="grid3c"><div class="fld"><label>Mes</label><select class="sel" data-b="${b('month')}" data-ty="int" ${dis}>${MES.map((m, k) => `<option value="${k + 1}"${+f.month === k + 1 ? ' selected' : ''}>${m}</option>`).join('')}</select></div><div class="fld"><label>Día</label><select class="sel" data-b="${b('md')}" data-ty="int" ${dis}>${Array.from({ length: 31 }, (_, k) => `<option value="${k + 1}"${+f.md === k + 1 ? ' selected' : ''}>${k + 1}</option>`).join('')}</select></div></div>` : ''}`;
  }
  if (f.t === 'int') body = `<div class="grid3c"><div class="fld"><label>Cada</label><div class="unit"><input class="inp" type="number" min="1" data-b="${b('n')}" data-ty="int" value="${f.n}" ${dis}><select class="sel" data-b="${b('iu')}" ${dis}>${[['h', 'horas'], ['d', 'días'], ['w', 'semanas'], ['m', 'meses']].map(([v, l]) => `<option value="${v}"${f.iu === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div><div class="fld"><label>A partir de</label>${dpk(b('anchor'), f.anchor, dis)}</div>${hourSel}</div>`;
  if (f.t === 'fec') body = `<div class="fld"><span class="lb">Fechas</span><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${(f.dates || []).slice().sort().map(d => `<span class="fc" style="cursor:default">${fDY(d)}${E ? `<button type="button" class="ibx" style="width:22px;height:22px" data-a="rmdate" data-i="${code}" data-v="${d}" aria-label="Quitar ${fDY(d)}">${ic('x', 12)}</button>` : ''}</span>`).join('')}${E ? `<button type="button" class="btn out xs" data-a="cal" data-b="${b('dates')}" data-add="1">${ic('plus', 14)}Agregar fecha</button>` : ''}</div>${(f.dates || []).length ? '' : mc('', 'Agrega al menos una fecha.')}</div><div class="grid3c">${hourSel}</div>`;
  if (f.t === 'med') {
    const rows = p.eqs.map(e => { const a = asset(e.id), m = meterNext(f, a); return `<div><span><b>${a.id}</b> <small>${esc2(a.n)}</small></span>${m ? `<small>Lectura ${fN(a.med.cur)} h</small><b>${fN(m.thr)} h · ${rel(m.date)}</b>` : `<small style="color:var(--amber)">Sin medidor</small><b style="color:var(--amber)">Nunca generará</b>`}</div>`; }).join('');
    body = `<div class="grid3c"><div class="fld"><label>Cada</label><div class="unit"><input class="inp" type="number" min="1" data-b="${b('mn')}" data-ty="int" value="${f.mn}" ${dis}><span class="u">horas</span></div></div><div class="fld"><label>Desde la lectura</label><div class="unit"><input class="inp" type="number" min="0" data-b="${b('mstart')}" data-ty="int" value="${f.mstart}" ${dis}><span class="u">h</span></div></div><div class="fld"><label>Avisar antes</label><div class="unit"><input class="inp" type="number" min="0" data-b="${b('mwarn')}" data-ty="int" value="${f.mwarn}" ${dis}><span class="u">h</span></div></div></div>
      <div class="fld"><span class="lb">Medidor de cada activo del plan</span>${p.eqs.length ? `<div class="mtr">${rows}</div>` : mc('i', 'Agrega activos para ver cuándo se dispara en cada uno.')}</div>`;
  }
  if (f.t === 'cond') body = `<div class="shrd">${ic('trend', 18)}<div style="flex:1;min-width:0"><b style="font-size:13px">${f.ctext ? 'Cuando ' + esc2(f.ctext) : 'Sin condición definida'}</b><div style="font-size:12px;color:var(--muted)">Se dispara al registrar una medición que cumple la condición.</div></div>${E ? `<button type="button" class="btn out xs" data-a="condpanel" data-i="${code}">Editar condición</button>` : ''}</div>${f.ctext ? '' : mc('', 'Define la condición que dispara la intervención.')}`;
  const tolU = (k, l) => `<div class="fld"><label>${l}</label><div class="unit"><input class="inp" type="number" min="0" data-b="${b(k)}" data-ty="int" value="${f[k] || 0}" ${dis}><span class="u">días</span></div></div>`;
  const common = f.t === 'med' || f.t === 'cond' ? '' : `<div class="grid4c"><div class="fld"><label>Vigente desde</label>${dpk(b('from'), f.from, dis)}</div><div class="fld"><label>Hasta <small>opcional</small></label>${dpk(b('to'), f.to, dis, 'Sin fin')}</div>${tolU('tb', 'Puede hacerse antes')}${tolU('ta', 'Vence después de')}</div>
    <div class="fld"><span class="lb">Exclusiones <small>días en que no se programa</small></span><div class="exc">${(f.excl || []).map((x, k) => `<div class="exr"><span><b>${fDY(x.a)} – ${fDY(x.b)}</b> <small>· ${esc2(x.why)}</small></span><span class="tg">${x.eff === 'shift' ? 'Corre la fecha' : 'Omite la fecha'}</span>${E ? `<button type="button" class="ibx dn" data-a="rmexc" data-i="${code}" data-v="${k}" aria-label="Quitar exclusión">${ic('x', 14)}</button>` : '<span></span>'}</div>`).join('')}
      ${U.vp['exc-' + code] ? excForm(code) : E ? `<button type="button" class="btn plain xs" style="align-self:flex-start" data-a="addexc" data-i="${code}">${ic('plus', 14)}Agregar exclusión</button>` : ''}</div></div>`;
  return `<div class="blk" id="when-${code}"><div class="blk-h"><h4>Cuándo</h4><small>${f.t === 'med' ? 'Se dispara con las lecturas del horómetro' : 'Las fechas se recalculan mientras editas'}</small><div class="r">${E ? `<button type="button" class="lnk" data-a="useshared" data-i="${code}">${ic('link', 14)}Usar calendario compartido</button>` : ''}</div></div>
    <div class="fq-ed"><div class="fq-f"><div class="fld"><span class="lb">Tipo</span><div class="segc" role="group" aria-label="Tipo de frecuencia">${[['cal', 'Calendario'], ['int', 'Intervalo'], ['fec', 'Fechas puntuales'], ['med', 'Por medidor'], ['cond', 'Por condición']].map(([k, l]) => `<button type="button" data-a="ftype" data-i="${code}" data-v="${k}" aria-pressed="${f.t === k}" ${dis}>${l}</button>`).join('')}</div></div>${body}${common}</div>${pvHTML(p, i)}</div></div>`;
}
function excForm(code) {
  const v = U.vp['exc-' + code];
  return `<div class="exr" style="grid-template-columns:1fr;gap:10px;background:var(--surface-2)"><div class="grid4c"><div class="fld"><label>Desde</label>${dpk('x:' + code + '.a', v.a, '')}</div><div class="fld"><label>Hasta</label>${dpk('x:' + code + '.b', v.b, '')}</div><div class="fld" style="grid-column:span 2"><label>Motivo</label><input class="inp" data-xv="why" data-i="${code}" value="${esc2(v.why)}" placeholder="Ej.: Parada de planta de fin de año"></div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="segc">${[['shift', 'Correr la fecha al día siguiente'], ['omit', 'Omitir la fecha']].map(([k, l]) => `<button type="button" data-a="xeff" data-i="${code}" data-v="${k}" aria-pressed="${v.eff === k}">${l}</button>`).join('')}</div><span style="flex:1"></span><button type="button" class="btn plain xs" data-a="excx" data-i="${code}">Cancelar</button><button type="button" class="btn pri xs" data-a="excok" data-i="${code}">Agregar</button></div>
    ${v.err ? mc('', v.err) : ''}</div>`;
}
function dpk(bind, val, dis, ph) { return `<button type="button" class="dpk" data-a="cal" data-b="${bind}" ${dis || ''} aria-label="Elegir fecha">${ic('calw', 15)}<span class="${val ? '' : 'ph'}">${val ? fDY(val) : (ph || 'Elegir fecha')}</span>${val && ph ? `<span class="ibx" data-a="clrdate" data-b="${bind}" style="width:22px;height:22px;flex:none" aria-label="Quitar fecha">${ic('x', 12)}</span>` : ''}</button>`; }
function pvHTML(p, i) {
  const f = freqOf(i);
  let list = '';
  if (f.t === 'med') list = p.eqs.length ? p.eqs.map(e => { const a = asset(e.id), m = meterNext(f, a); return m ? `<div class="d">${ic('gauge', 14)}<span><b>${a.id}</b> al llegar a ${fN(m.thr)} h<small style="display:block;color:var(--muted)">≈ ${fDL(m.date)} · ${fN(a.med.rate)} h/día</small></span></div>` : `<div class="d x">${ic('alert', 14)}<span><s>${a.id}</s><small>Sin medidor: nunca generará</small></span></div>`; }).join('') : '<div class="d x"><span></span><span>Sin activos</span></div>';
  else if (f.t === 'cond') list = `<div class="d">${ic('trend', 14)}<span>${f.ctext ? 'Cuando ' + esc2(f.ctext) : 'Define la condición'}</span></div>`;
  else { const ds = nextDates(f, 6); list = ds.length ? ds.map(x => x.x ? `<div class="d x">${ic('x', 14)}<span><s>${fDL(x.d)}</s><small>Excluida: ${esc2(x.why)}</small></span></div>` : `<div class="d${x.orig ? ' sh' : ''}">${ic('check', 14)}<span>${fDL(x.d)}${x.orig ? `<small>Corrida desde el ${fD(x.orig)} · ${esc2(x.why)}</small>` : ''}</span></div>`).join('') : `<div class="d x">${ic('alert', 14)}<span>Sin fechas próximas con esta configuración</span></div>`; }
  const tol = f.t === 'med' || f.t === 'cond' ? `Avisa ${fN(f.mwarn || 0)} h antes.` : `Disponible desde ${f.tb || 0} ${f.tb == 1 ? 'día' : 'días'} antes · vence ${f.ta || 0} ${f.ta == 1 ? 'día' : 'días'} después.`;
  return `<div class="pv" id="pv-${i.code}" aria-live="polite"><h5>${f.t === 'med' ? 'Próximos disparos' : 'Próximas fechas'}</h5><div class="nl">${esc2(freqText(f, true))}</div>${list}<div class="ft">${tol}${p.eqs.length > 1 && f.t !== 'med' ? ` Se repite en los ${p.eqs.length} activos.` : ''}</div></div>`;
}

/* ---- actividades ---- */
function actsHTML(p, i, E, sumA) {
  const code = i.code, open = U.oa[p.id + i.code];
  const dsum = i.acts.length ? `<div class="dsum">${ic('clock', 14)}<span>Las actividades suman <b>${fH(sumA)}</b>; la intervención estima <b>${fH(+i.dur || 0)}</b>.</span>${Math.abs(sumA - i.dur) > .01 ? `<span class="w">La OT usará ${fH(+i.dur || 0)}.</span>` : ''}</div>` : '';
  return `<div class="blk" id="acts-${code}"><div class="blk-h"><h4>Qué se hace</h4><small>Cada actividad es un paso de la OT</small><div class="r">${E ? `<button type="button" class="btn out xs" data-a="pickproc" data-i="${code}" data-new="1">${ic('clip', 14)}Agregar desde procedimiento</button><button type="button" class="btn out xs" data-a="addact" data-i="${code}">${ic('plus', 14)}Agregar actividad</button>` : ''}</div></div>
    ${i.acts.length ? `<div class="acts" data-dropz="${code}">${i.acts.map((a, k) => acHTML(p, i, a, k, E, open === a.code)).join('')}</div>${dsum}` : `<div class="empty" style="padding:16px">${ic('wrench', 18)}<span>Sin actividades, la OT tendrá un solo paso: «${esc2(i.n)}». Agrega actividades para guiar al técnico.</span></div>`}
  </div>`;
}
function acHTML(p, i, a, k, E, open) {
  const pr = a.proc && proc(a.proc), bp = x => `a:${i.code}:${a.code}.${x}`, dis = E ? '' : 'disabled';
  const permErr = a.perm && !a.permT;
  return `<div class="ac${open ? ' open' : ''}" data-ac="${a.code}" data-i="${i.code}" ${E ? 'draggable="true"' : ''}>
    <div class="ac-h" data-a="toggleact" data-i="${i.code}" data-c="${a.code}" role="button" tabindex="0" aria-expanded="${open}">
      <span class="gr" title="Arrastra para ordenar" aria-hidden="true">${ic('dots', 15)}</span><code>${a.code}</code>
      <div class="nm"><b>${esc2(a.n) || '<span style="color:var(--red)">Sin nombre</span>'}</b><small>${pr ? `<span class="tg p">${ic('clip', 11)}${pr.id} v${pr.v} · ${pr.steps.length} pasos</span>` : '<span>Sin procedimiento</span>'}${a.reps.length ? `<span>· ${a.reps.length} ${a.reps.length === 1 ? 'repuesto' : 'repuestos'}</span>` : ''}</small></div>
      <span class="du">${fH(+a.dur || 0)}</span>
      <span class="fl">${a.oblig ? '' : '<span class="tg">Opcional</span>'}${a.parada ? '<span class="tg w">Parada</span>' : ''}${a.perm ? `<span class="tg ${permErr ? 'w' : ''}">${permErr ? ic('alert', 11) : ''}Permiso</span>` : ''}</span>
      <span class="chev" style="color:var(--muted);transition:transform .2s;${open ? 'transform:rotate(90deg)' : ''}">${ic('chev', 15)}</span>
    </div>
    ${open ? `<div class="ac-b">
      <div class="grid3c"><div class="fld" style="grid-column:span 2"><label>Nombre</label><input class="inp${a.n.trim() ? '' : ' err'}" data-b="${bp('n')}" value="${esc2(a.n)}" ${dis}>${a.n.trim() ? '' : mc('', 'La actividad necesita un nombre.')}</div><div class="fld"><label>Duración</label><div class="unit"><input class="inp" type="number" min="0.25" step="0.25" data-b="${bp('dur')}" data-ty="num" value="${a.dur}" ${dis}><span class="u">horas</span></div></div></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap"><label class="sw" title="Sin resultado no deja cerrar la OT"><input type="checkbox" data-b="${bp('oblig')}" ${a.oblig ? 'checked' : ''} ${dis}><i></i>Obligatoria</label><label class="sw"><input type="checkbox" data-b="${bp('parada')}" ${a.parada ? 'checked' : ''} ${dis}><i></i>Requiere parada</label><label class="sw"><input type="checkbox" data-b="${bp('perm')}" ${a.perm ? 'checked' : ''} ${dis}><i></i>Requiere permiso de trabajo</label></div>
      ${a.perm ? `<div class="grid2c"><div class="fld"><label>Tipo de permiso</label><select class="sel${permErr ? ' err' : ''}" data-b="${bp('permT')}" ${dis}><option value="">Elige el tipo</option>${PERMISOS.map(x => `<option${a.permT === x ? ' selected' : ''}>${x}</option>`).join('')}</select>${permErr ? mc('', 'Indica el tipo de permiso: la OT lo exigirá antes de empezar.') : ''}</div></div>` : ''}
      <div class="fld"><label>Descripción <small>opcional</small></label><textarea class="inp" rows="2" data-b="${bp('desc')}" ${dis} placeholder="Instrucciones breves para el técnico">${esc2(a.desc)}</textarea></div>
      <div class="fld"><span class="lb">Procedimiento</span>${pr ? `<div class="prc"><span class="pci">${ic('clip', 17)}</span><div style="min-width:0"><b>${pr.id} v${pr.v} · ${esc2(pr.n)}</b><small>${pl(pr.steps.length, 'paso', 'pasos')} · ${pl(pr.steps.filter(s => s.ctrl).length, 'punto de control', 'puntos de control')} · ${pl(pr.steps.filter(s => s.med).length, 'medición', 'mediciones')} · ${fH(pr.dur)}</small></div><div class="r"><button type="button" class="btn plain xs" data-a="vsteps" data-i="${i.code}" data-c="${a.code}">${U.vp['st-' + i.code + a.code] ? 'Ocultar pasos' : 'Ver pasos'}</button>${E ? `<button type="button" class="btn plain xs" data-a="editproc" data-pr="${pr.id}">Editar</button><button type="button" class="btn plain xs" data-a="pickproc" data-i="${i.code}" data-c="${a.code}">Cambiar</button><button type="button" class="ibx dn" data-a="rmproc" data-i="${i.code}" data-c="${a.code}" aria-label="Quitar procedimiento">${ic('x', 14)}</button>` : ''}</div></div>
        ${U.vp['st-' + i.code + a.code] ? `<ol style="margin:6px 0 0;padding-left:20px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px">${pr.steps.map(s => `<li>${esc2(s.n)}${s.ctrl ? ' <span class="tg p">Control</span>' : ''}${s.med ? ` <span class="tg c">${esc2(s.med)}</span>` : ''}${s.ev ? ' <span class="tg">Evidencia</span>' : ''}</li>`).join('')}</ol><p class="msg i" style="margin-top:6px">${ic('help', 13)}<span>Al generar la OT, cada paso se copia: si cambias el procedimiento después, las OT ya generadas no cambian.</span></p>` : ''}`

  const g = (arr, key) => { const m = {}; arr.forEach(x => { const k = key(x); (m[k] = m[k] || []).push(x); }); return Object.entries(m).map(([k, xs]) => ({ k, xs, n: xs.length, c: xs.filter(isDone).length, w: xs.filter(x => x.ot && x.otS !== 'c').length, v: xs.filter(x => !x.ot && !x.done).length })).map(o => Object.assign(o, { pc: Math.round(o.c / o.n * 100) })).sort((a, b) => a.pc - b.pc); };
  return { due, byPlan: g(due, x => x.plan || x.src), byEq: g(due, x => x.eq), byK: ['plan', 'ron', 'tar'].map(k => { const xs = due.filter(x => kindOf(x) === k); return { k, n: xs.length, c: xs.filter(isDone).length }; }) };
}

/* ---- programa por ubicación: planta › área › activo › componente ---- */
function progHTML(ps) {
  const d0 = weekMon(U.md), days = Array.from({ length: 14 }, (_, k) => addD(d0, k)), items = opItems(ps, days[0], days[13]);
  const plants = U.planta === 'all' ? Object.keys(PLANTAS) : [U.planta];
  const eqIds = [...new Set(ps.flatMap(p => p.eqs.map(e => e.id)).concat(items.map(x => x.eq)))].filter(id => plants.includes(asset(id).pl));
  const by = (f) => { const m = {}; items.forEach(x => { const k = f(x); if (k) (m[k] = m[k] || []).push(x); }); return m; };
  const byEqDay = by(x => x.eq + '|' + x.d);
  const cellCls = xs => { const st = xs.map(x => xState(x)[0]).sort((a, b) => RANK[a] - RANK[b])[0]; return 's-' + st + (xs.some(x => x.parada) ? ' s-pz' : ''); };
  const cells = (getXs, lvl, key) => days.map(dd => { const xs = getXs(dd); const cls = `${dd === TODAY ? ' tdy' : ''}${dd === U.md ? ' sel' : ''}${wday(dd) > 5 ? ' we' : ''}`; if (!xs.length) return `<span class="pc${cls}"></span>`; const h = xs.reduce((t, x) => t + x.dur, 0); return `<button type="button" class="pc${cls}" data-a="mday" data-v="${dd}" title="${esc2(fDL(dd))}\n${esc2([...new Set(xs.map(x => (lvl === 'eq' ? '' : x.eq + ' · ') + x.intN))].join('\n'))}"><span class="mb ${lvl} ${cellCls(xs)}">${lvl === 'eq' ? (xs.length > 1 ? xs.length : '') : xs.length}</span></button>`; }).join('');
  let rows = '';
  plants.forEach(pl2 => {
    const pEqs = eqIds.filter(id => asset(id).pl === pl2); if (!pEqs.length) return;
    const pk = 'p:' + pl2, pOpen = !U.mc.has(pk), pAreas = [...new Set(pEqs.map(id => asset(id).area))].sort();
    rows += `<div class="gr lv0"><button type="button" class="gr-h" data-a="mtog" data-v="${pk}" aria-expanded="${pOpen}">${ic(pOpen ? 'chevd' : 'chev', 14)}${ic('domain', 15)}<b>${PLANTAS[pl2]}</b><small>${pl(pEqs.length, 'activo', 'activos')}</small></button>${cells(dd => items.filter(x => x.d === dd && asset(x.eq).pl === pl2), 'pl')}</div>`;
    if (!pOpen) return;
    pAreas.forEach(ar => {
      const ak = 'a:' + pl2 + '|' + ar, aOpen = !U.mc.has(ak), aEqs = pEqs.filter(id => asset(id).area === ar);
      rows += `<div class="gr lv1${U.mf === pl2 + '|' + ar ? ' foc' : ''}" id="ar-${(pl2 + ar).replace(/[^a-z0-9]/gi, '')}"><button type="button" class="gr-h" data-a="mtog" data-v="${esc2(ak)}" aria-expanded="${aOpen}">${ic(aOpen ? 'chevd' : 'chev', 14)}<b>${esc2(ar)}</b><small>${pl(aEqs.length, 'activo', 'activos')}</small></button>${cells(dd => items.filter(x => x.d === dd && aEqs.includes(x.eq)), 'ar')}</div>`;
      if (!aOpen) return;

        rows += `<div class="gr lv2"><button type="button" class="gr-h" data-a="noop" data-m="Ficha del activo ${id}" title="${esc2(a.n)}"><span class="eqn"><b>${esc2(a.n)}</b><small>${id}${comps.length ? ` › ${esc2(comps.join(', '))}` : ''}</small></span></button>${cells(dd => byEqDay[id + '|' + dd] || [], 'eq')}</div>`;

    <div class="prog-h"><div><h3>Programa por ubicación</h3><p>Planta › área › activo › componente · ${fD(days[0])} al ${fD(days[13])}</p></div>

function saveProc() {
  const d = PN.d; if (!d.n.trim() || !d.steps.length || d.steps.some(s => !s.n.trim())) { PN.err = true; panel(); return; }

        <div class="fld"><label for="ndu">Duración estimada</label><div class="unit"><input id="ndu" class="inp" type="number" step="0.5" min="0.5" data-pv="dur" value="${PN.dur}"><span class="u">horas</span></div></div></div>
      <div class="fld"><label>Prioridad</label><div class="segc">${PRIOS.map(s => `<button type="button" data-a="nprio" data-v="${s}" aria-pressed="${PN.prio === s}">${s}</button>`).join('')}</div></div>

};

/* ---------- registrar una ronda ---------- */
function ronFindings(pa, ans) { const its = pItems(pa); return its.map((it, i) => ({ it, i, v: ans[i] })).filter(o => (o.it.t === 'ok' && o.v === 'no') || (o.it.t === 'num' && o.v !== '' && o.v != null && ((o.it.min != null && +o.v < o.it.min) || (o.it.max != null && +o.v > o.it.max)))); }
const rng = it => it.min != null && it.max != null ? `${fN(it.min, 1)}–${fN(it.max, 1)} ${it.u}` : it.max != null ? `máx. ${fN(it.max, it.max % 1 ? 1 : 0)} ${it.u}` : `mín. ${fN(it.min, 1)} ${it.u}`;

      : it.t === 'num' ? `<div class="unit sm2"><input id="ra-${i}" class="inp${miss ? ' err' : ''}" type="number" step="any" data-ra="${i}" value="${esc2(v)}" aria-label="${esc2(it.n)}"><span class="u">${it.u}</span></div>`

      : `<input id="ra-${i}" class="inp" data-ra="${i}" value="${esc2(v)}" placeholder="Opcional" aria-label="${esc2(it.n)}">`;
    return `<div class="rr${bad ? ' bad' : ''}"><div class="rr-n"><b>${esc2(it.n)}</b>${it.crit ? ' <span class="tg w">Crítico</span>' : ''}${it.t === 'num' ? `<small>Rango ${rng(it)}</small>` : ''}${bad ? `<small class="rr-f">${ic('bell', 12)}Pasa a Avisos como hallazgo</small>` : ''}</div>${ctl}</div>`; }).join('')}</div>`).join('');

    ${x.done.hall.length ? `<div class="mini">${x.done.hall.map(id => aviso(id)).filter(Boolean).map(a => `<button type="button" class="mini-r" data-a="avopen" data-v="${a.id}">${sevChip(a.sev)}<span><b>${esc2(a.t)}</b><small>${a.id} · ${a.st === 'ot' ? 'en la ' + a.ot : a.st === 'desc' ? 'descartado' : 'sin tratar'}</small></span>${ic('chev', 14)}</button>`).join('')}</div>` : ''}` : '';

    : !x.done ? mc('i', `Se puede registrar desde el ${fDL(x.avail)}.`, 'help') : ''}`;

const pnFreq = () => PN.mode === 'sh' ? shared(PN.sh).f : freq({ t: 'cal', rep: PN.mode === 'm' ? 'm' : 'w', days: PN.days, md: +PN.md || 1, hour: PN.hour || '08:00', tb: PN.tb, ta: PN.ta, from: '2026-01-01' });

      : `<div class="fld"><label for="fqsh">Calendario</label><select id="fqsh" class="sel" data-pv="sh"><option value="">Elige un calendario</option>${SHARED.map(c => `<option value="${c.id}"${PN.sh === c.id ? ' selected' : ''}>${esc2(c.n)}</option>`).join('')}</select>${mc('i', 'Si alguien cambia el calendario en la Biblioteca, cambia aquí también.', 'help')}</div>`}

function eqChips(sel, pl2) { return `<div class="eqc">${ASSETS.filter(a => a.pl === pl2).map(a => `<button type="button" class="fc" data-a="rqeq" data-v="${a.id}" aria-pressed="${sel.includes(a.id)}" title="${esc2(a.n)}">${a.id}</button>`).join('')}</div>`; }

      <div class="grid2c"><div class="fld"><label for="trs">Responsable</label><select id="trs" class="sel" data-pv="resp">${PEOPLE.map(p => `<option value="${p.id}"${PN.resp === p.id ? ' selected' : ''}>${esc2(p.n)}</option>`).join('')}</select></div>

        ${a.t === 'num' ? `<div class="fld"><label for="pamn">Mínimo</label><input id="pamn" class="inp" type="number" step="any" data-pa="min" value="${a.min}"></div><div class="fld"><label for="pamx">Máximo</label><input id="pamx" class="inp" type="number" step="any" data-pa="max" value="${a.max}"></div><div class="fld"><label for="pau2">Unidad</label><input id="pau2" class="inp" data-pa="u" value="${esc2(a.u)}" placeholder="°C, bar, mm/s"></div>` : ''}</div>

/* acciones de firma */

  otLog(o.id, `Firmado por ${f.n.trim()} · ${SROLE[d.v][0].toLowerCase()}`); render(); toastU(`Firma de ${f.n.trim()} registrada.`);

/* trazo de la firma */
let SIGD = null;

    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; if (!r.width) return;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1E2A5A';
    const d = U.ot && ((OTM[U.ot] || {}).sgd || {})[cv.dataset.sig]; if (d) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = d; }
  });
}
document.addEventListener('pointerdown', e => {

NA.objron = d => { NA.ronnew(); const a = asset(d.v); PN.pl = a.pl; PN.eqs = [d.v]; PN.objs = d.c ? { [d.v]: d.c } : {}; PN.n = `Inspección ${d.c ? d.c.toLowerCase() : a.n}`; panel(); };

/* ronda: hechos del panel con lo que se inspecciona */
const roccP = PANELS.rocc; PANELS.rocc = () => { const r = roccP(), x = xByKey(PN.k); if (x && x.objs && Object.keys(x.objs).length) r.b = r.b.replace(`<b>${x.eqs.join(', ')}</b>`, `<b>${x.eqs.map(id => id + (x.objs[id] ? ' › ' + esc2(x.objs[id]) : '')).join(', ')}</b>`); return r; };

document.addEventListener('input', e => { const t = e.target; if (t.dataset.robj && PN) { (PN.objs = PN.objs || {})[t.dataset.robj] = t.value; if (!t.value) delete PN.objs[t.dataset.robj]; panel(); } }, true);
FKEYS.push('robj');

  if ('navclose' in d) { document.body.classList.remove('nav-open'); return; }
