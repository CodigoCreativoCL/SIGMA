<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Inicio SIGMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<style>
/* ===== SIGMA · Inicio (Default.aspx) · tokens de sigma-brand.css + estándar CLAUDE.md · tema claro con widget oscuro ===== */
:root{
  --sg-navy:#0B0F1A; --sg-purple:#6C5CFF; --sg-purple-hover:#5847E8; --sg-teal:#00E0C2; --sg-blue:#2563EB; --sg-pink:#FF4D9D;
  --sigma-purple:#6732F4; --sigma-purple-dark:#4820C9; --sigma-purple-soft:#F2EFFF;
  --sigma-blue:#087BEA; --sigma-blue-soft:#EAF4FF; --sigma-cyan:#16C6C9; --sigma-cyan-dark:#007F8A; --sigma-cyan-soft:#E8FBFB;
  --ink:#0B0F1A; --ink-2:#334155; --muted:#64748B; --faint:#94A3B8; --line:#E2E8F0; --line-2:#EEF1F6;
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --chip:#F3F5F8;
  --ok:#16855B; --ok-soft:#E7F5EE; --warn:#B65C00; --warn-soft:#FFF4E6; --bad:#C7352B; --bad-soft:#FDECEA;
  --nav-idle:#C3C8DA;
  /* widget SIGMA AI (oscuro) */
  --ai-bg:#070B16; --ai-card:rgba(255,255,255,.045); --ai-line:rgba(148,163,214,.16); --ai-ink:#F4F6FF; --ai-ink-2:#B7BED6; --ai-muted:#7E87A6;
  --ai-crit:#FF5C8A; --ai-high:#FFB547; --ai-mid:#00E0C2;
  --e1:0 0 0 1px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.04);
  --e2:0 0 0 1px rgba(15,23,42,.05),0 4px 10px rgba(15,23,42,.05),0 18px 36px rgba(15,23,42,.08);
  --font:'Sora','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid rgba(22,198,201,.45);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.tn{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===================== sidebar (igual a sigma-layout.css) ===================== */
.side{position:fixed;top:0;left:0;bottom:0;width:240px;z-index:40;color:#fff;display:flex;flex-direction:column;
  background:radial-gradient(circle at 12% 88%,rgba(0,224,194,.12),rgba(0,0,0,0) 27%),radial-gradient(circle at 94% 72%,rgba(108,92,255,.32),rgba(0,0,0,0) 38%),linear-gradient(165deg,#0B0F1A 0%,#121630 56%,#21134F 100%);
  box-shadow:14px 0 42px rgba(15,12,45,.12);transition:width .2s}
.logo-box{height:70px;display:flex;align-items:center;padding-left:18px;background:#0B0F1A;flex:none;overflow:hidden}
.logo-box img{height:64px;width:auto;display:block}
.logo-box .sm{display:none;height:46px}
.nav{flex:1;overflow:auto;padding:14px 14px 12px;scrollbar-width:none}
.nav-t{padding:16px 13px 7px;color:rgba(255,255,255,.34);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:43px;padding:7px 42px 7px 13px;margin-bottom:3px;border-radius:11px;color:var(--nav-idle);font-size:12.5px;font-weight:500;line-height:1.25;text-decoration:none;transition:background-color .12s,color .12s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a i{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.nav a .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.6}
.nav a.on{background-image:linear-gradient(100deg,#6C5CFF,#7B3FF2);color:#fff;font-weight:600;box-shadow:0 8px 20px rgba(91,56,235,.35)}
.nav a.on i{background:rgba(255,255,255,.18)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--sg-teal)}
.ubox{display:flex;align-items:center;gap:10px;padding:14px 14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.ubox .av{position:relative;width:38px;height:38px;border-radius:50%;background:#E6E9F0;display:flex;align-items:center;justify-content:center;flex:none;color:#9AA3B5;overflow:hidden}
.ubox .av::after{content:"";position:absolute;right:1px;bottom:1px;width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 2px #1B1440}
.ubox .who{min-width:0;flex:1}
.ubox b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubox small{display:block;font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubox button{border:0;background:transparent;color:rgba(255,255,255,.6);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.ubox button:hover{background:rgba(255,255,255,.08);color:#fff}
body.enlarged .side{width:70px}
body.enlarged .logo-box{padding:0;justify-content:center}
body.enlarged .logo-box .lg{display:none} body.enlarged .logo-box .sm{display:block}
body.enlarged .nav{padding-inline:10px}
body.enlarged .nav-t,body.enlarged .nav a span,body.enlarged .nav a .chev,body.enlarged .ubox .who,body.enlarged .ubox button{display:none}
body.enlarged .nav a{padding:7px;justify-content:center}
body.enlarged .ubox{justify-content:center;padding-inline:0}

/* ===================== topbar (igual a sigma-layout.css) ===================== */
.top{position:fixed;top:0;left:240px;right:0;height:70px;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;gap:16px;padding:0 24px 0 20px;transition:left .2s}
body.enlarged .top{left:70px}
.top-l{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0}
.hamb{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:10px;display:flex}
.hamb:hover{background:#F3F5F8}
.sg-search{position:relative;flex:0 1 360px;max-width:360px}
.sg-search input{width:100%;height:40px;padding:0 14px 0 40px;font-size:13px;color:var(--ink);background:#F3F5F8;border:1px solid transparent;border-radius:999px;outline:none}
.sg-search input::placeholder{color:var(--muted)}
.sg-search input:focus{background:#fff;border-color:#6C5CFF;box-shadow:0 0 0 3px rgba(108,92,255,.14)}
.sg-search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.cli{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#F3F5F8;font-size:13px;font-weight:600;color:var(--ink-2)}
.cli .ic{color:var(--sg-purple);width:16px;height:16px}
.tb{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 10px;border:0;background:transparent;border-radius:12px;font-size:13px;font-weight:700;color:var(--ink)}
.tb:hover{background:#F3F5F8}
.tb.rep .ic{color:#E5383B} .tb.ay .ic{color:var(--sg-purple)}
.bell{position:relative;width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#5B6BD6}
.bell:hover{background:#F3F5F8}
.bell span{position:absolute;top:2px;right:0;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:#E5383B;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.me{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:4px;border-radius:12px;color:var(--muted)}
.me .av{width:34px;height:34px;border-radius:50%;background:#E6E9F0;display:flex;align-items:center;justify-content:center;color:#9AA3B5;overflow:hidden}

/* ===================== contenido ===================== */
.page{margin-left:240px;padding-top:70px;transition:margin-left .2s;min-height:100vh}
body.enlarged .page{margin-left:70px}
.wrap{max-width:1480px;margin:0 auto;padding-block:30px 90px;padding-inline:32px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--sg-purple);text-transform:uppercase}
.head h1{font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-top:4px}
.head p{color:var(--ink-2);font-size:14px;margin-top:4px}
.head-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.shift{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:var(--e1);font-size:12.5px;color:var(--ink-2)}
.shift i{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.shift b{font-weight:700;color:var(--ink)}

.btn{height:40px;padding:0 16px;border:1px solid transparent;border-radius:11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:#fff;color:var(--ink);text-decoration:none;transition:background .15s,transform .1s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px}
.btn.pri{background:var(--sigma-purple);color:#fff;box-shadow:0 6px 16px rgba(103,50,244,.25)} .btn.pri:hover{background:var(--sigma-purple-dark)}
.btn.out{border-color:var(--sigma-blue);color:var(--sigma-blue);background:#fff} .btn.out:hover{background:var(--sigma-blue-soft)}
.btn.plain{background:transparent;color:var(--ink-2)} .btn.plain:hover{background:var(--chip)}
.btn.ghost{background:var(--sigma-purple-soft);color:var(--sigma-purple)} .btn.ghost:hover{background:#E6E0FF}

.card{background:#fff;border-radius:20px;box-shadow:var(--e1)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:15.5px;font-weight:800}
.sec-h small{color:var(--muted);font-size:12.5px;margin-left:8px;font-weight:500}

/* accesos directos */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:#fff;box-shadow:var(--e1);text-decoration:none;color:var(--ink);border:0;text-align:left;transition:transform .18s,box-shadow .18s;min-width:0}
.tile:hover{transform:translateY(-3px);box-shadow:var(--e2)}
.tile .ti{width:52px;height:52px;border-radius:16px;background:#F4F3FF;display:flex;align-items:center;justify-content:center}
.tile.dark .ti{background:radial-gradient(circle at 30% 20%,rgba(0,224,194,.25),transparent 55%),radial-gradient(circle at 80% 90%,rgba(108,92,255,.45),transparent 60%),#0B0F1A;box-shadow:0 8px 18px rgba(37,22,120,.28),inset 0 0 0 1px rgba(255,255,255,.08)}
.tile b{font-size:13.5px;font-weight:700;line-height:1.3}
.tile small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:2px}
.tile small i{width:7px;height:7px;border-radius:50%;flex:none}
.tile .go{position:absolute;top:16px;right:14px;color:var(--faint);opacity:0;transform:translateX(-4px);transition:.18s}
.tile:hover .go{opacity:1;transform:none;color:var(--sigma-purple)}
.tile .kb{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:700;color:var(--faint)}
.tile:hover .kb{opacity:0}
.tile .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--bg)}
.editing .tile:not(.add){animation:jig .35s ease-in-out infinite alternate}
.editing .tile .x{display:flex}
.editing .tile .go{display:none}
@keyframes jig{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.tile.add{border:1.5px dashed #CBD5E1;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:12.5px;min-height:132px}
.tile.add:hover{border-color:var(--sigma-purple);color:var(--sigma-purple);transform:none;box-shadow:none}

/* grilla principal */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}

/* ===================== widget SIGMA AI (oscuro, futurista) ===================== */
.ai{position:relative;overflow:hidden;border-radius:26px;color:var(--ai-ink);isolation:isolate;
  background:radial-gradient(900px 380px at -10% -20%,rgba(0,224,194,.16),transparent 60%),radial-gradient(700px 420px at 110% 120%,rgba(108,92,255,.38),transparent 60%),radial-gradient(500px 300px at 70% -30%,rgba(255,77,157,.12),transparent 60%),var(--ai-bg);
  box-shadow:0 24px 60px rgba(13,10,48,.35),inset 0 0 0 1px rgba(124,108,255,.28)}
.ai::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(148,163,214,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,214,.07) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse at 40% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 40% 30%,#000 20%,transparent 75%)}
.ai::after{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;z-index:-1;background:linear-gradient(180deg,transparent,rgba(0,224,194,.06),transparent);animation:scan 7s linear infinite}
@keyframes scan{to{top:110%}}
.ai-h{display:flex;align-items:center;gap:14px;padding:20px 22px 0;flex-wrap:wrap}
.ai-logo{position:relative;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.ai-logo::before{content:"";position:absolute;inset:-3px;border-radius:16px;background:conic-gradient(from 0deg,transparent 0 70%,#00E0C2 80%,#6C5CFF 90%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-t img{height:17px;display:block}
.ai-t small{display:block;font-size:12px;color:var(--ai-muted);margin-top:5px}
.live{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill-live{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;background:rgba(0,224,194,.1);box-shadow:inset 0 0 0 1px rgba(0,224,194,.35);font-size:11px;font-weight:800;letter-spacing:.12em;color:#5CF2DB}
.pill-live i{position:relative;width:8px;height:8px;border-radius:50%;background:#00E0C2}
.pill-live i::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #00E0C2;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(1.5);opacity:0}}
.sig{font-size:12px;color:var(--ai-ink-2)} .sig b{color:#fff;font-weight:700}
.ai-b{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;padding:18px 22px 0}
.lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#5CF2DB;display:flex;align-items:center;gap:8px}
.lab .conf{letter-spacing:.02em;text-transform:none;font-weight:700;color:var(--ai-ink-2);background:rgba(255,255,255,.06);border-radius:999px;padding:2px 9px}
.feat{display:flex;flex-direction:column;gap:14px;min-width:0}
.feat h3{font-size:21px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.feat .ctx{color:var(--ai-ink-2);font-size:12.5px;margin-top:2px}
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge{position:relative;width:118px;height:118px;flex:none}
.gauge svg{display:block}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font-size:28px;font-weight:800;line-height:1}
.gauge .v small{font-size:10.5px;color:var(--ai-muted);margin-top:4px;text-align:center;line-height:1.2}
.when{display:flex;flex-direction:column;gap:2px;min-width:0}
.when small{font-size:11.5px;color:var(--ai-muted)}
.when b{font-size:26px;font-weight:800;line-height:1.1;background:linear-gradient(90deg,#00E0C2,#7C8CFF 60%,#FF4D9D);-webkit-background-clip:text;background-clip:text;color:transparent}
.when span{font-size:12.5px;color:var(--ai-ink-2)}
.why{display:flex;flex-direction:column;gap:6px;padding-left:18px;border-left:1px solid var(--ai-line);min-width:0;flex:1}
.why div{display:flex;gap:8px;font-size:12px;color:var(--ai-ink-2);align-items:baseline}
.why div b{color:#fff;font-weight:700}
.why div::before{content:"";width:5px;height:5px;border-radius:50%;background:#7C8CFF;flex:none;transform:translateY(-2px)}
.chart{position:relative;border-radius:16px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--ai-line);padding:12px 12px 26px 40px}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 6px -28px;font-size:11.5px;color:var(--ai-muted)}
.chart-h b{font-size:18px;color:#fff;font-weight:800;margin-right:4px}
.chart-h .lg{display:flex;gap:12px;flex-wrap:wrap}
.chart-h .lg span{display:inline-flex;align-items:center;gap:6px}
.chart-h .lg i{width:14px;height:2px;border-radius:1px;background:#7C8CFF}
.chart-h .lg i.p{background:repeating-linear-gradient(90deg,#FF4D9D 0 4px,transparent 4px 7px)}
.chart-h .lg i.t{background:repeating-linear-gradient(90deg,#FFB547 0 6px,transparent 6px 9px)}
.plot{position:relative;height:150px}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ylab{position:absolute;left:-30px;font-size:10px;color:var(--ai-muted);transform:translateY(-50%)}
.xlab{position:absolute;bottom:-20px;font-size:10px;color:var(--ai-muted);transform:translateX(-50%);white-space:nowrap}
.thr{position:absolute;right:4px;font-size:10px;font-weight:700;color:#FFB547;transform:translateY(-120%)}
.nowdot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #7C8CFF,0 0 18px #7C8CFF}
.cross{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);pointer-events:none;display:none}
.tip{position:absolute;z-index:3;pointer-events:none;display:none;background:#fff;color:var(--ink);border-radius:10px;padding:7px 10px;font-size:11.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-110%)}
.tip b{display:block;font-size:12.5px}
.ai-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.dk{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)} .btn.dk:hover{background:rgba(255,255,255,.14)}
.btn.dkp{background:transparent;color:var(--ai-ink-2)} .btn.dkp:hover{background:rgba(255,255,255,.06);color:#fff}

.stream{display:flex;flex-direction:column;gap:10px;min-width:0}
.stream-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stream-h span{font-size:12px;color:var(--ai-muted)}
.pl{display:flex;flex-direction:column;gap:8px}
.pi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--ai-card);box-shadow:inset 0 0 0 1px var(--ai-line);border:0;color:inherit;text-align:left;width:100%;transition:background .2s}
.pi:hover{background:rgba(255,255,255,.08)}
.pi.on{background:rgba(124,108,255,.16);box-shadow:inset 0 0 0 1px rgba(124,108,255,.6)}
.pi.new{animation:arrive .7s ease-out}
@keyframes arrive{0%{opacity:0;transform:translateY(-10px);box-shadow:inset 0 0 0 1px #00E0C2,0 0 24px rgba(0,224,194,.35)}60%{opacity:1;transform:none;box-shadow:inset 0 0 0 1px #00E0C2,0 0 24px rgba(0,224,194,.25)}}
.pi .pic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.pi .pic i{width:9px;height:9px;border-radius:50%}
.pi b{display:block;font-size:12.5px;font-weight:700;color:#fff;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small{display:block;font-size:11.5px;color:var(--ai-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small em{font-style:normal;color:var(--ai-muted)}
.pr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pr b{font-size:13.5px}
.pr span{width:56px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;display:block}
.pr span i{display:block;height:100%;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:2px}
.stats div{border-radius:14px;padding:10px 12px;background:var(--ai-card);box-shadow:inset 0 0 0 1px var(--ai-line)}
.stats b{display:block;font-size:18px;font-weight:800}
.stats small{display:block;font-size:10.5px;color:var(--ai-muted);line-height:1.3}
.ask #ans:empty{display:none}
.ask{margin:18px 22px 20px;display:flex;flex-direction:column;gap:10px}
.ask-in{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;border-radius:15px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(124,108,255,.35)}
.ask-in:focus-within{box-shadow:inset 0 0 0 1px #7C8CFF,0 0 0 4px rgba(124,140,255,.15)}
.ask-in input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:#fff;font-size:13px}
.ask-in input::placeholder{color:var(--ai-muted)}
.ask-in .send{width:38px;height:38px;border:0;border-radius:11px;background:var(--sigma-purple);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(103,50,244,.45)}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{height:30px;padding:0 12px;border:0;border-radius:999px;background:rgba(255,255,255,.06);color:var(--ai-ink-2);font-size:12px;font-weight:600}
.sugs button:hover{background:rgba(255,255,255,.12);color:#fff}
.ans{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(124,108,255,.12);box-shadow:inset 0 0 0 1px rgba(124,108,255,.3);font-size:12.5px;color:#E6E9FF;line-height:1.55;animation:arrive .5s ease-out}
.ans .q{display:block;color:var(--ai-muted);font-size:11.5px;margin-bottom:2px}
.caret{display:inline-block;width:7px;height:14px;background:#7C8CFF;vertical-align:-2px;margin-left:2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* estado aprendiendo */
.learn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding:22px}
.learn h3{font-size:20px;font-weight:800}
.learn p{color:var(--ai-ink-2);font-size:13px;margin-top:6px;max-width:58ch}
.learn .steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.learn .steps span{font-size:12px;padding:6px 10px;border-radius:10px;background:var(--ai-card);box-shadow:inset 0 0 0 1px var(--ai-line);color:var(--ai-ink-2)}
.learn .steps span b{color:#fff}

/* columna derecha: hoy */
.today{padding:18px}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:48px 18px minmax(0,1fr);gap:8px;align-items:start;padding:0 0 14px}
.tl-i time{font-size:12px;font-weight:700;color:var(--ink-2);padding-top:1px}
.tl-i .dot{position:relative;width:18px;display:flex;justify-content:center;align-self:stretch}
.tl-i .dot::before{content:"";position:absolute;top:16px;bottom:-14px;width:2px;background:var(--line)}
.tl-i:last-child .dot::before{display:none}
.tl-i .dot i{width:12px;height:12px;border-radius:50%;border:2px solid var(--faint);background:#fff;margin-top:3px;position:relative}
.tl-i.done .dot i{border-color:var(--ok);background:var(--ok)}
.tl-i.now .dot i{border-color:var(--sigma-purple);background:var(--sigma-purple);box-shadow:0 0 0 4px rgba(103,50,244,.15)}
.tl-i b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.tl-i small{display:block;font-size:12px;color:var(--muted)}
.tl-i.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:4px}
.st.now{background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.next{background:var(--chip);color:var(--ink-2)}
.att{padding:18px}
.al{display:flex;flex-direction:column;gap:4px}
.al button{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:9px 8px;border-radius:12px;width:100%}
.al button:hover{background:var(--surface-2)}
.al .ai2{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.al b{display:block;font-size:12.5px;font-weight:700;line-height:1.3}
.al small{display:block;font-size:11.5px;color:var(--muted)}
.al .tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.c{background:var(--bad-soft);color:var(--bad)} .tag.a{background:var(--warn-soft);color:var(--warn)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .k .ic{color:var(--faint)}
.kpi .n{display:flex;align-items:baseline;gap:8px}
.kpi .n b{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.kpi .n span{font-size:12px;font-weight:700}
.up{color:var(--ok)} .dn{color:var(--bad)} .neu{color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d b{color:var(--bad);font-weight:700}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line-2);margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--sigma-cyan-dark)}
.meter em{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.spark{height:38px;margin-top:4px;position:relative}
.spark svg{width:100%;height:100%;display:block;overflow:visible}

/* OT recientes */
.ots{padding:18px 18px 8px}
.ot{display:grid;grid-template-columns:86px minmax(0,1.6fr) minmax(0,1fr) 104px 116px 32px;gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line-2);border-radius:0;font-size:12.5px}
.ot:hover{background:var(--surface-2)}
.ot.h{border-top:0;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding-block:4px 8px}
.ot.h:hover{background:transparent}
.ot code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;color:var(--ink-2);font-size:12px}
.ot .t b{display:block;font-weight:600;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ot .t small{color:var(--muted);font-size:11.5px}
.ot .who{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink-2)}
.ot .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ini{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none}
.es{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.es i{width:6px;height:6px;border-radius:50%;background:currentColor}
.es.venc{background:var(--bad-soft);color:var(--bad)} .es.curso{background:var(--sigma-blue-soft);color:var(--sigma-blue)} .es.prog{background:var(--chip);color:var(--ink-2)} .es.fin{background:var(--ok-soft);color:var(--ok)}
.pri-t{font-size:11.5px;font-weight:700} .pri-t.c{color:var(--bad)} .pri-t.a{color:var(--warn)} .pri-t.m{color:var(--ink-2)}
.ot .ib{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--faint);display:flex;align-items:center;justify-content:center}
.ot .ib:hover{background:var(--chip);color:var(--ink)}

/* vacío */
.empty{padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.empty h3{font-size:18px;font-weight:800}
.empty p{color:var(--muted);margin-top:6px;max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.steps3 div{border-radius:16px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:4px}
.steps3 b{font-size:13px} .steps3 small{color:var(--muted);font-size:12px}
.steps3 .ok{color:var(--ok);font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px}
.steps3 .nx{color:var(--sigma-purple);font-weight:700;font-size:12px}

/* popover agregar acceso */
.pop{position:fixed;z-index:70;background:#fff;border-radius:16px;box-shadow:var(--e2),0 30px 60px rgba(15,23,42,.18);padding:8px;width:280px;animation:arrive .2s ease-out}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;border-radius:10px;padding:8px;text-align:left;font-size:13px;font-weight:600}
.pop button:hover{background:var(--surface-2)}
.pop .ti{width:34px;height:34px;border-radius:10px;background:#F4F3FF;display:flex;align-items:center;justify-content:center}
.pop p{font-size:12px;color:var(--muted);padding:6px 8px}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;box-shadow:0 12px 32px rgba(15,23,42,.3);animation:arrive .25s ease-out}
.toast .ic{color:#5CF2DB}
.demo{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;gap:4px;align-items:center;background:#fff;border-radius:14px;box-shadow:var(--e2);padding:5px 5px 5px 12px;font-size:12px;color:var(--muted)}
.demo .seg{display:flex;gap:2px;background:var(--chip);border-radius:10px;padding:3px}
.demo .seg button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.demo .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--e1)}
.scrimm{position:fixed;inset:0;background:rgba(11,15,26,.45);z-index:39;display:none}


/* ===================== sidebar propuesto (.side.v2) ===================== */
.side.v2 .nav{padding-top:12px}
.side.v2 .nav-t{color:rgba(255,255,255,.55);padding:14px 13px 6px}
.nv-find{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px 0 13px;margin-bottom:4px;border:0;border-radius:11px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:#9AA3BD;font-size:12.5px;text-align:left}
.nv-find:hover{background:rgba(255,255,255,.1);color:#fff}
.nv-find span{flex:1}
.nv-find kbd,.ck kbd{font:600 10.5px var(--font);border-radius:6px;padding:1px 6px;background:rgba(255,255,255,.08);color:#AEB6CC}
.side.v2 .nav a i{width:30px;height:30px}
.side.v2 .nav a i .ic{width:17px!important;height:17px!important}
.side.v2 .nav a i.br{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.side.v2 .nav a.on i.br{background:rgba(255,255,255,.18)}
.nv-li{position:relative}
.nv-li > a .chev{transition:transform .18s}
.nv-li.open > a .chev{transform:translateY(-50%) rotate(90deg)}
.nv-li.open > a{color:#fff}
.nb{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:800;min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;flex:none}
.nb.r{background:rgba(255,92,138,.2);color:#FFA3BD} .nb.a{background:rgba(255,181,71,.18);color:#FFCB7A} .nb.n{background:rgba(0,224,194,.16);color:#5CF2DB}
.side.v2 .sub{display:none;position:relative;padding:0 0 6px}
.side.v2 .nv-li.open > .sub{display:block;animation:arrive .2s ease-out}
.side.v2 .sub::before{content:"";position:absolute;left:28px;top:0;bottom:12px;width:1px;background:rgba(255,255,255,.12)}
.side.v2 .sub-t{display:none}
.side.v2 .nav .sub a{min-height:32px;padding:6px 12px 6px 55px;margin:0 0 1px;font-size:12px;font-weight:500;color:#AEB4CB;border-radius:9px}
.side.v2 .nav .sub a:hover{color:#fff}
.side.v2 .rec a{min-height:34px;padding:5px 12px;font-size:12px;color:#AEB4CB}
.side.v2 .rec a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.v2 .rec a i{width:28px;height:28px}
#navFoot{padding:0 14px 8px}
.nv-col{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 13px;border:0;border-radius:10px;background:transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:600}
.nv-col:hover{background:rgba(255,255,255,.06);color:#fff}
.nv-col .ic{transition:transform .2s}
/* colapsado */
body.enlarged .side.v2 .nav{overflow:visible;padding-inline:10px}
body.enlarged .side.v2 .nav-t{font-size:0;height:1px;padding:0;margin:10px 8px;background:rgba(255,255,255,.1)}
body.enlarged .side.v2 .rec-t,body.enlarged .side.v2 .rec{display:none}
body.enlarged .side.v2 .nv-find{width:50px;padding:0;justify-content:center}
body.enlarged .side.v2 .nv-find span,body.enlarged .side.v2 .nv-find kbd{display:none}
body.enlarged .side.v2 .nb{position:absolute;top:6px;right:6px;min-width:8px;width:8px;height:8px;padding:0;font-size:0;margin:0;box-shadow:0 0 0 2px #121630}
body.enlarged .side.v2 .nb.r{background:#FF5C8A} body.enlarged .side.v2 .nb.a{background:#FFB547} body.enlarged .side.v2 .nb.n{background:#00E0C2}
body.enlarged .side.v2 .nv-li.open > .sub{display:none}
body.enlarged .side.v2 .nv-li:hover > .sub,body.enlarged .side.v2 .nv-li:focus-within > .sub{display:block;position:absolute;left:54px;top:0;width:230px;padding:8px;border-radius:14px;background:#151A33;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.08);z-index:60}
body.enlarged .side.v2 .sub::before{display:none}
body.enlarged .side.v2 .sub-t{display:block;padding:6px 10px 8px;font-size:12.5px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
body.enlarged .side.v2 .nav .sub a{padding:6px 10px;justify-content:flex-start}
body.enlarged #navFoot{padding:0 10px 8px}
body.enlarged .nv-col{justify-content:center;padding:0}
body.enlarged .nv-col span{display:none}
body.enlarged .nv-col .ic{transform:rotate(180deg)}

/* Ir a… */
.ck-scrim{position:fixed;inset:0;background:rgba(11,15,26,.5);z-index:85;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.ck{position:fixed;top:12vh;left:50%;transform:translateX(-50%);z-index:86;width:min(620px,calc(100vw - 32px));background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(11,15,26,.35);overflow:hidden;animation:arrive .2s ease-out}
.ck-in{display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.ck-in input:focus-visible{outline:none}
.ck-in input{flex:1;min-width:0;border:0;outline:0;font-size:15px;color:var(--ink);background:transparent}
.ck kbd{background:var(--chip);color:var(--muted)}
.ck-l{max-height:min(52vh,420px);overflow:auto;padding:6px 8px 10px}
.ck-g{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.ck-i{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:transparent;border-radius:11px;padding:8px 10px;text-align:left}
.ck-i b{display:block;font-size:13px;font-weight:600}
.ck-i small{display:block;font-size:11.5px;color:var(--muted)}
.ck-i.sel{background:var(--sigma-purple-soft)}
.ck-i.sel b{color:var(--sigma-purple)}
.ck-ic{width:34px;height:34px;border-radius:10px;background:var(--chip);color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.ck-i.sel .ck-ic{background:#fff;color:var(--sigma-purple)}
.ck-e{padding:24px;text-align:center;color:var(--muted)}
.ck-f{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.ck-f kbd{margin-right:3px}
@media (max-width:1280px){.grid{grid-template-columns:minmax(0,1fr)}.side-col{display:grid!important;grid-template-columns:1fr 1fr;align-items:start}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.ai-b{grid-template-columns:minmax(0,1fr)}.ot{grid-template-columns:76px minmax(0,1fr) 104px 32px}.ot .c3,.ot .c5{display:none}}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .22s;width:260px}
  body.nav-open .side{transform:none} body.nav-open .scrimm{display:block}
  .top,body.enlarged .top{left:0;padding-inline:8px 14px;gap:8px}
  .page,body.enlarged .page{margin-left:0}
  .sg-search{display:none}
  .tb span,.cli span{display:none}
  .cli{padding:0 11px}
  .wrap{padding-inline:16px;padding-top:22px}
  .side-col{grid-template-columns:minmax(0,1fr)!important}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile .kb{display:none}
  .hero{gap:14px}
  .why{padding-left:0;border-left:0;flex-basis:100%}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .learn{grid-template-columns:minmax(0,1fr)}
  .empty{grid-template-columns:minmax(0,1fr)}
  .steps3{grid-template-columns:minmax(0,1fr)}
  .demo{left:16px;right:16px;justify-content:space-between;flex-wrap:wrap}
  .ck-f{display:none}
  .demo > span{display:none}
}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:14px}.kpi .n b{font-size:23px}.kpi .n{flex-wrap:wrap;gap:2px 6px}.xs-h{display:none}.ai-h{padding:18px 16px 0}.ai-b{padding:16px 16px 0}.ask{margin:16px}.live .sig{display:none}.ot{grid-template-columns:minmax(0,1fr) auto}.ot code,.ot .ib,.ot.h{display:none}}
.wrap2[hidden],.wrap[hidden]{display:none!important}

/* =====================================================================
   PROPUESTA 2 · Inicio con SIGMA AI al centro (Three.js r160 + GSAP 3.12)
   ===================================================================== */
.wrap2{gap:26px}
/* ---------- héroe ---------- */
.hx{position:relative;isolation:isolate;overflow:hidden;border-radius:30px;min-height:560px;color:#fff;
  background:radial-gradient(1000px 520px at 78% 40%,rgba(108,92,255,.30),transparent 60%),radial-gradient(700px 420px at 5% 0%,rgba(0,224,194,.14),transparent 60%),radial-gradient(600px 380px at 100% 100%,rgba(255,77,157,.16),transparent 60%),#060A14;
  box-shadow:0 30px 80px rgba(13,10,48,.35),inset 0 0 0 1px rgba(124,108,255,.25)}
.hx::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(148,163,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,214,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 30% 40%,#000 15%,transparent 70%)}
.hx canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.hx-fb{position:absolute;right:12%;top:50%;width:300px;height:300px;margin-top:-170px;border-radius:50%;z-index:0;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 30%),conic-gradient(from 200deg,#00E0C2,#2563EB,#6C5CFF,#FF4D9D,#00E0C2);filter:blur(.3px);box-shadow:0 0 120px rgba(108,92,255,.6);opacity:.85;animation:fbspin 18s linear infinite}
.hx-fb::after{content:"";position:absolute;inset:-60px;border-radius:50%;border:1px solid rgba(124,140,255,.35);box-shadow:0 0 0 60px rgba(124,140,255,.04)}
.hx.has3d .hx-fb{display:none}
@keyframes fbspin{to{transform:rotate(360deg)}}
.hx-in{position:relative;z-index:2;max-width:600px;padding:40px 44px 0;display:flex;flex-direction:column;gap:18px;pointer-events:none}
.hx-in > *{pointer-events:auto}
.hx-ey{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#AEB6D6}
.hx-t{font-size:clamp(34px,4.2vw,54px);font-weight:800;line-height:1.04;letter-spacing:-.025em;text-wrap:balance}
.hx-t .gr{background:linear-gradient(95deg,#00E0C2 0%,#5B8CFF 45%,#9B7BFF 70%,#FF4D9D 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hx-t .ch{display:inline-block;will-change:transform}
.hx-brief{font-size:16.5px;line-height:1.65;color:#C7CEE8;max-width:56ch}
.hx-brief b{color:#fff;font-weight:700}
.ent{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;margin:0 2px;border:0;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:700;vertical-align:1px;transition:background .2s,box-shadow .2s}
.ent i{width:8px;height:8px;border-radius:50%;background:#FFB547;box-shadow:0 0 10px currentColor}
.ent.c i{background:#FF5C8A} .ent.a i{background:#FFB547}
.ent:hover{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.hx-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.hx-stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:30px 44px 72px;max-width:980px}
.gs{border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;min-width:0}
.gs .rg{width:46px;height:46px;flex:none;position:relative}
.gs .rg svg{display:block}
.gs .v{min-width:0}
.gs .v b{display:block;font-size:24px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.gs .v b small{font-size:13px;color:#8E97B8;font-weight:700;margin-left:2px}
.gs .v > span{display:block;font-size:11.5px;color:#9AA3C4;line-height:1.35}
.gs .v em{font-style:normal;color:#5CF2DB;font-weight:700}
.gs .ico{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:#B8C0FF}
.hx-lab{position:absolute;inset:0;z-index:1;pointer-events:none}
.nl{position:absolute;left:0;top:0;transform:translate(-50%,-140%);white-space:nowrap;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:12px;background:rgba(10,14,30,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 24px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11.5px;color:#C9CFE6;transition:opacity .3s;pointer-events:auto;cursor:pointer;border:0}
.nl b{color:#fff;font-weight:800;font-size:12.5px}
.nl i{width:8px;height:8px;border-radius:50%;flex:none}
.nl::after{content:"";position:absolute;left:50%;bottom:-14px;width:1px;height:14px;background:linear-gradient(rgba(255,255,255,.4),transparent)}
.nl.hide{opacity:0}
.hx-tip{position:absolute;z-index:4;left:0;top:0;pointer-events:none;opacity:0;transform:translate(14px,-50%);transition:opacity .15s;min-width:200px;max-width:260px;padding:10px 12px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.hx-tip b{display:block;font-size:13px}
.hx-tip small{display:block;color:var(--muted);font-size:11.5px}
.hx-tip .st2{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.hx-hint{position:absolute;z-index:2;right:26px;bottom:78px;font-size:11.5px;color:#7E87A6;display:flex;align-items:center;gap:8px;pointer-events:none}
.hx-hint i{width:6px;height:6px;border-radius:50%;background:#00E0C2;box-shadow:0 0 8px #00E0C2}

/* ---------- barra «Pregúntale a SIGMA AI» (monta sobre el borde del héroe) ---------- */
.askwrap{position:relative;z-index:5;margin:-62px auto 0;width:min(860px,calc(100% - 32px));display:flex;flex-direction:column;gap:12px}
.askbar{position:relative;display:flex;align-items:center;gap:12px;height:66px;padding:0 9px 0 12px;border-radius:22px;background:#0D1226;box-shadow:0 22px 50px rgba(13,10,48,.35);isolation:isolate}
.askbar::before{content:"";position:absolute;inset:-1.5px;z-index:-1;border-radius:23.5px;background:conic-gradient(from var(--ang,0deg),#00E0C2,#2563EB,#6C5CFF,#FF4D9D,#00E0C2);animation:angle 6s linear infinite}
.askbar::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:22px;background:#0D1226}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes angle{to{--ang:360deg}}
.ab-orb{width:46px;height:46px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.askbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:15.5px}
.askbar input::placeholder{color:#8B94B6}
.askbar .wave{display:flex;align-items:center;gap:3px;height:24px;margin-right:4px}
.askbar .wave i{width:3px;border-radius:2px;background:linear-gradient(#00E0C2,#6C5CFF);animation:wv 1.2s ease-in-out infinite}
.askbar .wave i:nth-child(1){height:8px;animation-delay:-.2s}.askbar .wave i:nth-child(2){height:16px;animation-delay:-.5s}.askbar .wave i:nth-child(3){height:22px;animation-delay:-.1s}.askbar .wave i:nth-child(4){height:12px;animation-delay:-.7s}.askbar .wave i:nth-child(5){height:18px;animation-delay:-.35s}
@keyframes wv{50%{transform:scaleY(.35)}}
.askbar .send{width:48px;height:48px;border:0;border-radius:15px;background:var(--sigma-purple);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(103,50,244,.5);flex:none}
.askbar .send:hover{background:var(--sigma-purple-dark)}
.sugs2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sugs2 button{height:32px;padding:0 13px;border:0;border-radius:999px;background:#fff;box-shadow:var(--e1);font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.sugs2 button:hover{color:var(--sigma-purple);box-shadow:var(--e2)}
.sugs2 button .ic{color:var(--sigma-purple)}
#ans2:empty{display:none}
#ans2 .ans{background:#0D1226;box-shadow:inset 0 0 0 1px rgba(124,108,255,.35),0 18px 40px rgba(13,10,48,.25);border-radius:18px;padding:16px 18px;font-size:13.5px}

/* ---------- próximos 30 días ---------- */
.t30{padding:22px 22px 14px}
.t30 .sec-h{align-items:flex-start;flex-wrap:wrap}
.t30 .sec-h p{color:var(--muted);font-size:13px;margin-top:4px}
.lg3{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}
.lg3 span{display:inline-flex;align-items:center;gap:6px}
.lg3 i{width:16px;height:10px;border-radius:5px}
.lg3 i.c{background:#FF5C8A} .lg3 i.a{background:#FFB547} .lg3 i.m{background:#00BFAE}
.lg3 i.s{background:repeating-linear-gradient(135deg,#C9D2E3 0 3px,#F3F5F8 3px 6px);border-radius:3px}
.tg{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) 200px;column-gap:18px;align-items:center}
.tg-ax{position:relative;height:30px;grid-column:2}
.tg-ax span{position:absolute;bottom:6px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--faint);white-space:nowrap}
.tg-ax span.now{color:var(--sigma-purple)}
.tr{display:contents}
.tr > *{padding-block:9px;border-top:1px solid var(--line-2)}
.tr:hover > *{background:var(--surface-2)}
.tl-a{display:flex;align-items:center;gap:12px;min-width:0;padding-left:8px;border-radius:14px 0 0 14px;cursor:pointer}
.tl-a .pc{position:relative;width:40px;height:40px;flex:none}
.tl-a .pc svg{display:block}
.tl-a .pc b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.tl-a strong{display:block;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-a small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:58px}
.trk .wk{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.trk .stop{position:absolute;top:6px;bottom:6px;border-radius:8px;background:repeating-linear-gradient(135deg,rgba(148,163,184,.28) 0 3px,transparent 3px 7px)}
.trk .tdy{position:absolute;top:0;bottom:0;width:2px;background:var(--sigma-purple);border-radius:1px}
.cap{position:absolute;top:50%;height:26px;margin-top:-13px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;transform-origin:left center;white-space:nowrap;box-shadow:0 6px 14px rgba(15,23,42,.12)}
.cap.c{background:linear-gradient(90deg,#FF7AA0,#FF4D80)} .cap.a{background:linear-gradient(90deg,#FFC66B,#F59E0B);color:#3B2600} .cap.m{background:linear-gradient(90deg,#2BD9C4,#00A897)}
.cap::before{content:"";position:absolute;left:-60px;width:60px;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,currentColor);opacity:.0}
.pin{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:7px;transform:rotate(45deg);background:var(--sigma-purple);box-shadow:0 0 0 3px #fff,0 6px 14px rgba(103,50,244,.4);display:flex;align-items:center;justify-content:center}
.pin .ic{transform:rotate(-45deg);color:#fff}
.tl-x{padding-right:8px;border-radius:0 14px 14px 0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tl-x small{font-size:11px;color:var(--muted)}
.tl-x small b{color:var(--sigma-purple)}
.btn.okd{background:var(--ok-soft);color:var(--ok);box-shadow:none;cursor:default}
.t30-learn{display:flex;align-items:center;gap:18px;padding:18px;border-radius:18px;background:var(--surface-2)}
.t30-learn .bar{flex:1;height:10px;border-radius:5px;background:#E6E9F2;overflow:hidden}
.t30-learn .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#00E0C2,#6C5CFF);border-radius:5px}

/* ---------- módulos (bento) ---------- */
.bento{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:132px;gap:14px;perspective:900px}
.bt{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:16px;border-radius:20px;background:#fff;box-shadow:var(--e1);text-decoration:none;color:var(--ink);overflow:hidden;transform-style:preserve-3d;will-change:transform;min-width:0}
.bt:hover{box-shadow:var(--e2)}
.bt .ti{width:46px;height:46px;border-radius:14px;background:#F4F3FF;display:flex;align-items:center;justify-content:center}
.bt b{font-size:13.5px;font-weight:700;line-height:1.25}
.bt small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;line-height:1.35}
.bt small i{width:7px;height:7px;border-radius:50%;flex:none}
.bt.big{grid-column:span 2;grid-row:span 2;padding:22px;color:#fff;background:radial-gradient(420px 260px at 85% 90%,rgba(108,92,255,.55),transparent 60%),radial-gradient(300px 200px at 0% 0%,rgba(0,224,194,.2),transparent 60%),#0A0F20;box-shadow:0 18px 40px rgba(13,10,48,.25),inset 0 0 0 1px rgba(124,108,255,.25)}
.bt.big .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5CF2DB}
.bt.big h3{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.bt.big p{color:#B7BED6;font-size:13px;max-width:30ch;margin-top:6px}
.bt.big .ft{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;color:#fff}
.bt.big .ft span{display:inline-flex;align-items:center;gap:6px;color:#C9CFE6;font-weight:600}
.bt.big .ft span i{width:7px;height:7px;border-radius:50%;background:#00E0C2;box-shadow:0 0 8px #00E0C2}
.bt.big .ft .go2{margin-left:auto;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:background .2s}
.bt.big:hover .ft .go2{background:var(--sigma-purple)}
.bt.big .sym{position:absolute;right:-6px;bottom:30px;opacity:.95;filter:drop-shadow(0 0 30px rgba(108,92,255,.55));animation:floaty 6s ease-in-out infinite;pointer-events:none}
@keyframes floaty{50%{transform:translateY(-10px) rotate(4deg)}}

/* ---------- inferior ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}

}

function spark(vals, good) {
  const lo = Math.min(...vals), hi = Math.max(...vals), X = i => i / (vals.length - 1) * 200, Y = v => 34 - (v - lo) / (hi - lo || 1) * 30;
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${X(i)} ${Y(v)}`).join('');
  return `<div class="spark"><svg viewBox="0 0 200 38" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L200 38L0 38Z" fill="rgba(37,99,235,.08)"/><path d="${d}" fill="none" stroke="#2563EB" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></div>`;

}

    uniforms: coreU, transparent: true, depthWrite: false,
    vertexShader: 'varying vec3 vN; varying vec3 vP; void main(){ vN=normalize(normalMatrix*normal); vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: `uniform float t; uniform float k; uniform float calm; varying vec3 vN; varying vec3 vP;
      vec3 g(float x){ vec3 a=vec3(0.,.878,.761), b=vec3(.145,.388,.922), c=vec3(.424,.361,1.), d=vec3(1.,.302,.616);
        if(x<.48) return mix(a,b,x/.48); if(x<.74) return mix(b,c,(x-.48)/.26); return mix(c,d,(x-.74)/.26); }

        col=mix(col,vec3(0.,.88,.76),calm*.5);
        float band=.5+.5*sin(vP.y*10.+t*(1.8-calm)); float n=.5+.5*sin(vP.x*7.+vP.z*6.-t*1.3);
        gl_FragColor=vec4(col*(.28+f*1.5)+band*.05+n*.04,(.18+f*.95)*k); }`
  }));
  const core = new THREE.Mesh(track(new THREE.IcosahedronGeometry(1.15, 6)), coreMat); spin.add(core);
  const wire = new THREE.LineSegments(track(new THREE.WireframeGeometry(track(new THREE.IcosahedronGeometry(1.36, 1)))), track(new THREE.LineBasicMaterial({ color: 0x8C9BFF, transparent: true, opacity: .32 })));
  spin.add(wire);
  const halo = new THREE.Sprite(track(new THREE.SpriteMaterial({ map: tex, color: 0x6C5CFF, transparent: true, opacity: .6, blending: THREE.AdditiveBlending, depthWrite: false })));
  halo.scale.set(7.5, 7.5, 1); tilt.add(halo);
  const halo2 = new THREE.Sprite(track(new THREE.SpriteMaterial({ map: tex, color: 0x00E0C2, transparent: true, opacity: .25, blending: THREE.AdditiveBlending, depthWrite: false })));
  halo2.scale.set(4, 4, 1); tilt.add(halo2);

  /* coraza de partículas (esfera de Fibonacci) */
  const NP = 1100, pp = new Float32Array(NP * 3), pc = new Float32Array(NP * 3), cols = GRAD.map(c => new THREE.Color(c));
  for (let i = 0; i < NP; i++) {
    const y = 1 - (i / (NP - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963, R = 1.7 + (Math.random() - .5) * .12;
    pp[i * 3] = Math.cos(th) * r * R; pp[i * 3 + 1] = y * R; pp[i * 3 + 2] = Math.sin(th) * r * R;
    const c = cols[i % 4]; pc[i * 3] = c.r; pc[i * 3 + 1] = c.g; pc[i * 3 + 2] = c.b;
  }
  const shellG = track(new THREE.BufferGeometry()); shellG.setAttribute('position', new THREE.BufferAttribute(pp, 3)); shellG.setAttribute('color', new THREE.BufferAttribute(pc, 3));
  const shell = new THREE.Points(shellG, track(new THREE.PointsMaterial({ size: .03, vertexColors: true, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false, map: tex })));
  spin.add(shell);

  /* órbitas */
  const RADII = [2.35, 3.2, 4.05], rings = [];
  RADII.forEach((r, i) => {
    const pts = new THREE.EllipseCurve(0, 0, r, r).getPoints(200).map(p => new THREE.Vector3(p.x, 0, p.y));
    const l = new THREE.LineLoop(track(new THREE.BufferGeometry().setFromPoints(pts)), track(new THREE.LineBasicMaterial({ color: i === 1 ? 0x6C5CFF : 0x3E4C9A, transparent: true, opacity: i === 1 ? .55 : .4 })));
    tilt.add(l); rings.push(l);
  });

  /* activos */
  const hitGeo = track(new THREE.SphereGeometry(.26, 8, 8)), hitMat = track(new THREE.MeshBasicMaterial({ visible: false }));
  const N = [];
  opt.nodes.forEach((n, i) => {
    const risk = n.risk && opt.mode !== 'empty';
    const ring = n.ring != null ? n.ring : i % 3, perRing = Math.ceil(opt.nodes.length / 3);
    const a0 = (Math.floor(i / 3) / perRing) * Math.PI * 2 + ring * .7;
    const color = risk ? sevColor(n.p) : 0x6F7CC8;
    const m = new THREE.Mesh(track(new THREE.SphereGeometry(risk ? .11 : .062, 16, 16)), track(new THREE.MeshBasicMaterial({ color, transparent: true, opacity: risk ? 1 : .85 })));
    const g = new THREE.Sprite(track(new THREE.SpriteMaterial({ map: tex, color, transparent: true, opacity: risk ? .9 : .35, blending: THREE.AdditiveBlending, depthWrite: false })));
    g.scale.setScalar(risk ? .95 : .34);
    const hit = new THREE.Mesh(hitGeo, hitMat); hit.userData.id = n.id;
    const holder = new THREE.Group(); holder.add(m, g, hit); tilt.add(holder);
    const o = { n, risk, ring, r: RADII[ring], a: a0, sp: (.045 + (2 - ring) * .018) * (i % 2 ? 1 : .92), m, g, hit, holder, pulse: Math.random() * 6, spawn: reduced ? 1 : 0, link: null, packets: [] };
    if (risk) {
      const lg = track(new THREE.BufferGeometry()); lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
      o.link = new THREE.Line(lg, track(new THREE.LineBasicMaterial({ color, transparent: true, opacity: .45, blending: THREE.AdditiveBlending })));
      tilt.add(o.link);
      for (let k = 0; k < 3; k++) {
        const s = new THREE.Sprite(track(new THREE.SpriteMaterial({ map: tex, color, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false })));
        s.scale.setScalar(.22); tilt.add(s); o.packets.push({ s, u: k / 3 });
      }
    }
    N.push(o);
  });

  /* fondo estrellado */
  const NS = 500, sp = new Float32Array(NS * 3);
  for (let i = 0; i < NS; i++) { sp[i * 3] = (Math.random() - .5) * 60; sp[i * 3 + 1] = (Math.random() - .5) * 34; sp[i * 3 + 2] = -10 - Math.random() * 30; }
  const starG = track(new THREE.BufferGeometry()); starG.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  const stars = new THREE.Points(starG, track(new THREE.PointsMaterial({ size: .06, color: 0x9AA6D8, transparent: true, opacity: .5, depthWrite: false })));
  scene.add(stars);

  /* intro */
  let coreReady = reduced || !gsap;
  if (!reduced && gsap) {
    core.scale.setScalar(.01); wire.scale.setScalar(.01); shell.scale.setScalar(.01);
    gsap.to([core.scale, wire.scale, shell.scale], { x: 1, y: 1, z: 1, duration: 1.6, ease: 'expo.out', stagger: .08, delay: .15, onComplete: () => { coreReady = true; } });
    rings.forEach((l, i) => { l.scale.setScalar(.2); l.material.opacity = 0; gsap.to(l.scale, { x: 1, y: 1, z: 1, duration: 1.8, ease: 'expo.out', delay: .3 + i * .12 }); gsap.to(l.material, { opacity: i === 1 ? .55 : .4, duration: 1.2, delay: .3 + i * .12 }); });
    N.forEach((o, i) => gsap.to(o, { spawn: 1, duration: 1.6, ease: 'expo.out', delay: .55 + i * .018 }));
  } else N.forEach(o => o.spawn = 1);

  /* interacción */
  const host = opt.host || canvas.parentElement, ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), hits = N.map(o => o.hit);
  let hover = null, par = { x: 0, y: 0 }, parT = { x: 0, y: 0 }, focusId = null, focusT = 0;
  function onMove(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    parT.x = (x - .5) * .5; parT.y = (y - .5) * .3;
    mouse.set(x * 2 - 1, -(y * 2 - 1)); ray.setFromCamera(mouse, camera);
    const it = ray.intersectObjects(hits, false)[0];
    const id = it ? it.object.userData.id : null;
    if (id !== (hover && hover.n.id)) { hover = id ? N.find(o => o.n.id === id) : null; host.style.cursor = hover ? 'pointer' : ''; }
    if (hover && opt.onHover) opt.onHover(hover.n, e.clientX - host.getBoundingClientRect().left, e.clientY - host.getBoundingClientRect().top);
    else if (opt.onLeave) opt.onLeave();
  }
  function onLeave() { hover = null; parT.x = parT.y = 0; host.style.cursor = ''; opt.onLeave && opt.onLeave(); }
  function onClick() { if (hover && opt.onSelect) opt.onSelect(hover.n.id); }
  host.addEventListener('pointermove', onMove); host.addEventListener('pointerleave', onLeave); host.addEventListener('click', onClick);

  /* tamaño */
  function resize() {
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const wide = w > 980;
    camera.fov = wide ? 36 : 46; camera.updateProjectionMatrix();
    world.position.set(wide ? Math.min(4.6, 2 + (w - 980) / 260) : 1.6, wide ? .15 : 1.1, 0);
    world.scale.setScalar(wide ? 1 : .82);
  }
  const ro = new ResizeObserver(resize); ro.observe(canvas); resize();

  /* bucle */
  const v = new THREE.Vector3(), clock = new THREE.Clock(); let running = true, raf = 0, t = 0;
  const labels = (opt.labels || []).map(id => ({ id, el: opt.labelEl ? opt.labelEl.querySelector(`[data-nl="${id}"]`) : null, o: N.find(o => o.n.id === id) })).filter(x => x.el && x.o);
  function frame() {
    raf = requestAnimationFrame(frame);
    if (!running) return;
    const dt = Math.min(clock.getDelta(), .05); if (!reduced) t += dt;
    coreU.t.value = t;
    par.x += (parT.x - par.x) * .05; par.y += (parT.y - par.y) * .05;
    world.rotation.y = par.x; world.rotation.x = par.y * .6;
    spin.rotation.y = t * .12; spin.rotation.x = Math.sin(t * .3) * .08;
    wire.rotation.y = -t * .2; shell.rotation.y = t * .05;
    if (coreReady) core.scale.setScalar(1 + Math.sin(t * 1.4) * .025);
    halo.material.opacity = .5 + Math.sin(t * 1.1) * .12;
    stars.rotation.y = t * .004;
    if (focusT > 0) focusT = Math.max(0, focusT - dt);
    N.forEach(o => {
      o.a += o.sp * dt * (reduced ? 0 : 1);
      const r = o.r * (1 + (1 - o.spawn) * 2.2), y = Math.sin(o.a * 2 + o.ring) * .06;
      o.holder.position.set(Math.cos(o.a) * r, y, Math.sin(o.a) * r);
      o.holder.visible = o.spawn > .02;
      const isF = focusId === o.n.id && focusT > 0, isH = hover === o;
      let s = o.risk ? 1 + Math.sin(t * 3 + o.pulse) * .18 : 1;
      if (isH || isF) s *= 1.8;
      o.m.scale.setScalar(s * o.spawn); o.g.scale.setScalar((o.risk ? .95 : .34) * s * (isF ? 1.6 : 1) * o.spawn);
      if (o.link) {
        const a = o.link.geometry.attributes.position.array, p = o.holder.position;
        a[0] = p.x; a[1] = p.y; a[2] = p.z; a[3] = a[4] = a[5] = 0; o.link.geometry.attributes.position.needsUpdate = true;
        o.link.material.opacity = (.25 + Math.sin(t * 2 + o.pulse) * .12 + (isF || isH ? .4 : 0)) * o.spawn;
        o.packets.forEach(k => { k.u = (k.u + dt * .45) % 1; k.s.position.set(p.x * (1 - k.u), p.y * (1 - k.u), p.z * (1 - k.u)); k.s.material.opacity = Math.sin(k.u * Math.PI) * o.spawn; });
      }
    });
    renderer.render(scene, camera);
    if (labels.length) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      labels.forEach(l => {
        l.o.holder.getWorldPosition(v); const z = v.z; v.project(camera);
        const x = (v.x * .5 + .5) * w, y = (-v.y * .5 + .5) * h;
        l.el.style.transform = `translate(${x}px,${y}px) translate(-50%,-140%)`;
        l.el.classList.toggle('hide', z < -1.2 || l.o.spawn < .9);
      });
    }
  }
  frame();

  return {
    setRunning(b) { running = b; if (b) clock.getDelta(); },
    focus(id) { focusId = id; focusT = 2.2; },
    dispose() {
      cancelAnimationFrame(raf); ro.disconnect();
      host.removeEventListener('pointermove', onMove); host.removeEventListener('pointerleave', onLeave); host.removeEventListener('click', onClick);
      disposables.forEach(d => d.dispose && d.dispose()); renderer.dispose();
    }
  };
}
window.SG3D = { mount };
window.dispatchEvent(new Event('sg3d-ready'));

</script>
