<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Centro de Soporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap">
<style>
/* ===== SIGMA · Centro de Soporte · estándar UI de CLAUDE.md (paleta del logo), solo modo claro ===== */
:root{
  --sigma-purple:#6732F4; --sigma-purple-dark:#4820C9; --sigma-purple-soft:#F2EFFF;
  --sigma-blue:#087BEA; --sigma-blue-dark:#0565C2; --sigma-blue-soft:#EAF4FF;
  --sigma-cyan:#16C6C9; --sigma-cyan-dark:#007F8A; --sigma-cyan-soft:#E8FBFB;
  --ink:#17223B; --ink-2:#3C4760; --muted:#68738A; --faint:#A3ACBE; --line:#E2E7F0; --field:#CFD6E3; --label:#4A556D;
  --surface:#FFFFFF; --surface-2:#F8F9FC; --canvas:#F4F6FA;
  --success:#16855B; --success-soft:#E7F5EE; --warning:#B65C00; --warning-ink:#9A4D00; --warning-soft:#FFF4E6; --danger:#C7352B; --danger-soft:#FDECEA;
  --navy:#141B33; --navy-2:#1E2745; --navy-ink:#AEB6CC;
  --c1:#6732F4; --c2:#00A0A6; --c3:#D97706; --c4:#0B6FD1;
  --e1:0 0 0 1px rgba(23,34,59,.05),0 1px 2px rgba(23,34,59,.04),0 4px 12px rgba(23,34,59,.04);
  --e2:0 0 0 1px rgba(23,34,59,.05),0 2px 4px rgba(23,34,59,.04),0 12px 32px rgba(23,34,59,.08);
  --e3:0 0 0 1px rgba(23,34,59,.06),0 8px 16px rgba(23,34,59,.06),0 24px 56px rgba(23,34,59,.14);
  --r:16px; --font:'Sora','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 13.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(22,198,201,.35);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Marco ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;overflow:hidden;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px}
.brand svg{flex:none}
.brand b{font-size:19px;font-weight:800;letter-spacing:.14em}
.brand small{display:block;font-size:9px;letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase;line-height:1.2;margin-top:2px}
.nav{flex:1;overflow:auto;padding:4px 12px 16px;scrollbar-width:thin;scrollbar-color:#2C3658 transparent}
.nav-h{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#6F7896;padding:12px 10px 6px}
.nav a,.nav button.nv{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border:0;border-radius:11px;background:transparent;color:#C9CFE0;text-decoration:none;font-size:13px;font-weight:600;text-align:left}
.nav a:hover,.nav button.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.nav .chev{margin-left:auto;opacity:.6;transition:transform .2s}
.nav .open > .nv .chev{transform:rotate(90deg)}
.nav .sub{display:flex;flex-direction:column;gap:1px;padding:4px 0 6px 18px;position:relative}
.nav .sub::before{content:"";position:absolute;left:21px;top:6px;bottom:10px;width:1px;background:#2E385A}
.nav .sub a{height:34px;font-size:12.5px;font-weight:500;padding-left:22px;color:#AEB6CC}
.nav .sub .sub{padding-left:14px}
.nav .sub .sub::before{left:17px}
.nav a[aria-current="page"]{background:var(--sigma-purple);color:#fff;font-weight:700;box-shadow:0 6px 16px rgba(103,50,244,.35)}
.nav .is-in > .nv{color:#fff}
.nav .soon{margin-left:auto;font-size:10px;font-weight:800;color:var(--navy);background:var(--sigma-cyan);border-radius:999px;padding:1px 7px}
.side-foot{padding:12px 16px 16px;border-top:1px solid #222B4A;display:flex;align-items:center;gap:10px}
.side-foot b{display:block;font-size:12.5px}
.side-foot small{color:var(--navy-ink);font-size:11px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:10px;padding:0 24px;background:rgba(255,255,255,.98);box-shadow:0 1px 0 var(--line)}
.top .menu-btn{display:none}
.gsearch{position:relative;flex:0 1 380px;min-width:0}
.gsearch input{width:100%;height:40px;border:0;border-radius:12px;background:var(--canvas);padding:0 14px 0 40px;font-size:13px}
.gsearch .ic{position:absolute;left:13px;top:11px;color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:10px;font:700 11px var(--font);color:var(--muted);background:#fff;border-radius:6px;padding:1px 6px;box-shadow:inset 0 -1px 0 rgba(23,34,59,.12)}
.top .grow{flex:1}
.tbtn{height:40px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;position:relative;white-space:nowrap}
.tbtn:hover{background:var(--canvas);color:var(--ink)}
.tbtn.icon{width:40px;padding:0;justify-content:center}
.tbtn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px #fff}
.plant{height:38px;padding:0 12px;border:0;border-radius:11px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink)}
.persona{display:flex;align-items:center;gap:6px;padding:4px;border-radius:12px;background:var(--canvas)}
.persona button{height:32px;padding:0 10px;border:0;border-radius:9px;background:transparent;font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.persona button[aria-pressed="true"]{background:#fff;color:var(--sigma-purple);box-shadow:var(--e1)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;background:var(--sigma-blue-soft);color:var(--sigma-blue-dark)}
.av.sm{width:26px;height:26px;font-size:10px}
.av.xs{width:22px;height:22px;font-size:9px}
.av.p{background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.av.c{background:var(--sigma-cyan-soft);color:var(--sigma-cyan-dark)}
.av.w{background:var(--warning-soft);color:var(--warning-ink)}
.av.g{background:var(--canvas);color:var(--muted)}
.view{padding:24px 28px 64px;max-width:1440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.bnav{display:none}

/* ---------- Encabezado de página ---------- */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:600;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.crumbs a:hover{color:var(--sigma-blue);background:var(--sigma-blue-soft)}
.crumbs span{color:var(--ink);font-weight:700}
.crumbs i{font-style:normal;color:var(--faint)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph .t{flex:1;min-width:240px}
.ph h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph p{color:var(--muted);font-size:14px;margin-top:4px;max-width:70ch}
.ph .acts{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Botones por función ---------- */
.btn{height:40px;padding:0 16px;border:1px solid transparent;border-radius:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;background:#fff;color:var(--ink);text-decoration:none;transition:background .15s,box-shadow .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px}
.btn.xs{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.pri{background:var(--sigma-purple);color:#fff;box-shadow:0 6px 16px rgba(103,50,244,.22)}
.btn.pri:hover{background:var(--sigma-purple-dark)}
.btn.sec{background:var(--sigma-cyan-dark);color:#fff}
.btn.sec:hover{background:#006872}
.btn.out{border-color:var(--sigma-blue);color:var(--sigma-blue)}
.btn.out:hover{background:var(--sigma-blue-soft)}
.btn.ghost{background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.btn.ghost:hover{background:#E6E0FF}
.btn.dan{background:var(--danger);color:#fff}
.btn.plain{background:transparent;color:var(--ink-2)}
.btn.plain:hover{background:var(--canvas)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.link{border:0;background:transparent;padding:4px 6px;margin:-4px -6px;border-radius:8px;color:var(--sigma-blue);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap}
.link:hover{background:var(--sigma-blue-soft);color:var(--sigma-blue-dark)}
.ibtn{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:hover{background:var(--canvas);color:var(--ink)}

/* ---------- Superficies ---------- */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--e1);padding:18px 20px;min-width:0}
.card.pad0{padding:0}
.ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ch .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ch h2,.ch h3{font-size:15px;font-weight:800;line-height:1.3}
.ch p{font-size:12.5px;color:var(--muted);margin-top:2px}
.ch .g{flex:1;min-width:0}
.ch .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tone-p{background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.tone-b{background:var(--sigma-blue-soft);color:var(--sigma-blue)}
.tone-c{background:var(--sigma-cyan-soft);color:var(--sigma-cyan-dark)}
.tone-w{background:var(--warning-soft);color:var(--warning-ink)}
.tone-d{background:var(--danger-soft);color:var(--danger)}
.tone-s{background:var(--success-soft);color:var(--success)}
.tone-n{background:var(--canvas);color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 380px}

/* KPI */
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--e1);padding:16px 18px;display:flex;align-items:center;gap:14px;min-width:0;border:0;text-align:left;width:100%}
button.kpi:hover{box-shadow:var(--e2)}
.kpi .ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi strong{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{font-weight:800}
.delta.up{color:var(--danger)} .delta.ok{color:var(--success)}

/* Chips, estados y prioridades */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.n{background:var(--canvas);color:var(--muted)}
.prio{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.prio svg{width:14px;height:14px}
.prio.c{background:var(--danger);color:#fff}
.prio.a{background:var(--danger-soft);color:var(--danger)}
.prio.m{background:var(--warning-soft);color:var(--warning-ink)}
.prio.b{background:var(--canvas);color:var(--muted)}
.sla{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.sla.w{color:var(--warning-ink)} .sla.d{color:var(--danger)} .sla.s{color:var(--success)}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--canvas);color:var(--ink-2);white-space:nowrap}

/* Tabs (pestaña activa morada + subrayado de 3 px) */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--sigma-purple);border-bottom-color:var(--sigma-purple)}
.tabs b{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--canvas);color:var(--muted);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.tabs button[aria-selected="true"] b{background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:11px;background:var(--canvas)}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--sigma-purple);box-shadow:var(--e1)}

/* Formularios */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.f > .lb{font-size:11px;font-weight:800;color:var(--label);letter-spacing:.02em}
.f .req{color:var(--danger)}
.f .hint{font-size:12px;color:var(--muted)}
.in,.sel,.ta{width:100%;height:42px;border:1px solid var(--field);border-radius:9px;background:#fff;padding:0 12px;font-size:13.5px;color:var(--ink);min-width:0}
.ta{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.in:focus,.sel:focus,.ta:focus{outline:3px solid rgba(22,198,201,.27);border-color:var(--sigma-cyan-dark)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fg .full{grid-column:1/-1}
.optcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-size:13px;font-weight:700;color:var(--ink)}
.opt small{font-weight:500;color:var(--muted);font-size:11.5px}
.opt .ic{color:var(--muted)}
.opt:hover{border-color:var(--field)}
.opt[aria-pressed="true"]{border-color:var(--sigma-purple);background:var(--sigma-purple-soft);box-shadow:0 0 0 1px var(--sigma-purple)}
.opt[aria-pressed="true"] .ic{color:var(--sigma-purple)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:32px;padding:0 12px;border:0;border-radius:999px;background:var(--canvas);color:var(--ink-2);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pill:hover{background:#ECEFF5}
.pill[aria-pressed="true"]{background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.switch{position:relative;width:38px;height:22px;border-radius:11px;border:0;background:#CFD6E3;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"]{background:var(--sigma-purple)}
.switch[aria-checked="true"]::after{left:19px}
.drop{display:flex;align-items:center;gap:14px;padding:16px;border:2px dashed var(--field);border-radius:14px;background:var(--surface-2);transition:border-color .15s,background .15s}
.drop.is-over{border-color:var(--sigma-cyan-dark);background:var(--sigma-cyan-soft)}
.drop .di{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;box-shadow:var(--e1)}
.drop .dt{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.drop .dt b{display:block;color:var(--ink);font-size:13.5px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.file{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.file .fi{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.file b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{font-size:11.5px;color:var(--muted)}
.prog{height:5px;border-radius:3px;background:#E7EAF2;overflow:hidden;margin-top:4px}
.prog span{display:block;height:100%;background:var(--sigma-cyan-dark);border-radius:3px;transition:width .2s}

/* Listas */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:var(--surface-2);border:0;width:100%;text-align:left;color:inherit;text-decoration:none}
button.row:hover,a.row:hover{background:#fff;box-shadow:var(--e2)}
.row .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.row strong{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row .e{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mut{color:var(--muted)}
.sec-t{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Tickets (lista híbrida) */
.tk{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 150px 150px 28px;gap:16px;align-items:center;padding:14px 16px;border:0;border-radius:14px;background:#fff;box-shadow:var(--e1);width:100%;text-align:left;color:inherit;position:relative}
.tk:hover{box-shadow:var(--e2)}
.tk::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.tk.p-c::before{background:var(--danger)}
.tk .id{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tk h3{font-size:14.5px;font-weight:700;line-height:1.35;margin:3px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.tk .meta span{display:inline-flex;align-items:center;gap:5px}
.tk .who{display:flex;align-items:center;gap:10px;min-width:0}
.tk .who b{display:block;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .who small{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.tk .st{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tk .go{color:var(--faint)}
.tk-head{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 150px 150px 28px;gap:16px;padding:0 16px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.unread{width:8px;height:8px;border-radius:50%;background:var(--sigma-blue);display:inline-block}

/* Filtros */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:1 1 300px;min-width:0}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{width:100%;height:42px;border:1px solid var(--field);border-radius:11px;background:#fff;padding:0 12px 0 38px;font-size:13.5px}
.search input:focus{outline:3px solid rgba(22,198,201,.27);border-color:var(--sigma-cyan-dark)}
.fbtn{height:34px;padding:0 10px 0 12px;border:1px dashed var(--field);border-radius:999px;background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;position:relative}
.fbtn:hover{border-color:var(--muted)}
.fbtn.on{border-style:solid;border-color:var(--sigma-purple);background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.fmenu{position:absolute;z-index:60;min-width:220px;max-height:320px;overflow:auto;background:#fff;border-radius:14px;box-shadow:var(--e3);padding:6px}
.fmenu label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.fmenu label:hover{background:var(--surface-2)}
.fmenu input{accent-color:var(--sigma-purple);width:16px;height:16px}

/* Línea de tiempo */
.tl{position:relative;display:flex;flex-direction:column;gap:0}
.tl-i{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-dot{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.tl-c{min-width:0;padding-top:2px}
.tl-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted)}
.tl-h b{color:var(--ink);font-size:13px}
.tl-h .who-t{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:6px}
.tl-t{font-size:13.5px;margin-top:3px}
.tl-q{margin-top:8px;padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.tl-i.is-user .tl-q{background:var(--sigma-blue-soft)}
.tl-i.is-int .tl-q{background:var(--warning-soft);color:#6B4300}
.tl-i.is-sys .tl-t{color:var(--muted)}
.tl-chg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.tl-file{display:inline-flex;align-items:center;gap:10px;margin-top:8px;padding:8px 12px 8px 8px;border-radius:12px;background:#fff;box-shadow:var(--e1)}
.tl-file .th{width:52px;height:38px;border-radius:8px;background:linear-gradient(135deg,#DDE3EE,#F4F6FA);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl-file b{font-size:12.5px;display:block}
.tl-file small{font-size:11px;color:var(--muted)}
.tl-res{margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--success-soft);color:#0E5C3E;font-size:13.5px}
.reply{margin-top:6px;background:#fff;border-radius:var(--r);box-shadow:var(--e1);overflow:hidden}
.reply .rt{display:flex;gap:2px;padding:6px 6px 0}
.reply .rt button{height:34px;padding:0 12px;border:0;border-radius:9px 9px 0 0;background:transparent;font-size:12.5px;font-weight:700;color:var(--muted)}
.reply .rt button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.reply .rt button.int[aria-pressed="true"]{background:var(--warning-soft);color:var(--warning-ink)}
.reply textarea{display:block;width:100%;min-height:90px;border:0;background:var(--surface-2);padding:12px 14px;resize:vertical;font-size:13.5px}
.reply textarea:focus{outline:0}
.reply.int textarea{background:#FFF9F0}
.reply .rb{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.reply .rb .g{flex:1}

/* Panel lateral de detalle */
.dl{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr);gap:9px 14px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{font-weight:600;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sla-box{border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.sla-box .bar{height:6px;border-radius:3px;background:#E7EAF2;overflow:hidden;margin-top:8px}
.sla-box .bar span{display:block;height:100%;border-radius:3px}

/* Feedback */
.fb-faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:700;font-size:13px}
.face svg{width:34px;height:34px}
.face:hover{border-color:var(--field)}
.face[aria-pressed="true"]{border-color:var(--sigma-purple);background:var(--sigma-purple-soft);color:var(--sigma-purple)}
.stars{display:flex;gap:4px}
.stars button{width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:#D4D9E4;display:flex;align-items:center;justify-content:center}
.stars button.on{color:#F2A900}
.stars button:hover{background:var(--surface-2)}

/* Gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .gl{stroke:#EDF0F5}
.hb{display:flex;flex-direction:column;gap:9px}
.hb-r{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:12.5px}
.hb-r .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink-2)}
.hb-r .tr{height:12px;border-radius:0 4px 4px 0;background:transparent;position:relative}
.hb-r .tr span{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--sigma-purple);min-width:3px}
.hb-r .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hb-r:hover .tr span{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.meter{height:10px;border-radius:5px;background:#E7EAF2;overflow:hidden;display:flex;gap:2px}
.meter span{height:100%}
.tipbox{position:fixed;z-index:3000;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:10px;box-shadow:0 8px 24px rgba(23,34,59,.25);max-width:240px}
.tipbox b{font-weight:800}

.lc{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:11px;color:var(--muted)}
.lc-y{position:relative}
.lc-y span{position:absolute;right:0;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.lc-plot{position:relative}
.lc-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc-dot{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.lc-xh{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed #A3ACBE;opacity:0;pointer-events:none}
.lc-hit{position:absolute;top:0;bottom:0}
.lc-x{position:relative;height:18px;margin-top:8px}
/* Campañas */
.cc{display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:var(--e1);overflow:hidden;min-width:0;border:0;text-align:left;color:inherit;padding:0}
button.cc:hover{box-shadow:var(--e2)}
.cc .cv{position:relative;height:118px;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;overflow:hidden}
.cc .cv svg.bg{position:absolute;inset:0;width:100%;height:100%}
.cc .cv .st{position:absolute;top:12px;left:12px}
.cc .cv .ty{position:relative;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.18);border-radius:6px;padding:2px 8px}
.cc .cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cc h3{font-size:15px;font-weight:800;line-height:1.3}
.cc p{font-size:12.5px;color:var(--muted)}
.cc .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.cc .stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.cc .stats b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.cc .stats small{font-size:11px;color:var(--muted);font-weight:600}
.cc .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-top:2px}

/* Asistentes (stepper) */
.wz{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.steps{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:var(--r);box-shadow:var(--e1);padding:10px}
.step{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border:0;border-radius:12px;background:transparent;text-align:left}
.step:not(:last-child)::after{content:"";position:absolute;left:24px;top:40px;height:12px;width:2px;background:var(--line)}
.step:hover{background:var(--surface-2)}
.step[aria-current="step"]{background:var(--sigma-purple-soft)}
.step .n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted);background:#fff}
.step[aria-current="step"] .n{background:var(--sigma-purple);color:#fff;box-shadow:0 0 0 4px rgba(103,50,244,.15)}
.step.done .n{background:var(--success-soft);color:var(--success);box-shadow:none}
.step b{display:block;font-size:13px;font-weight:800}
.step[aria-current="step"] b{color:var(--sigma-purple)}
.step small{display:block;font-size:11.5px;color:var(--muted)}
.wz-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:var(--e2)}
.wz-foot .g{flex:1;font-size:12.5px;color:var(--muted);font-weight:700}

/* Constructor de audiencia */
.aud{display:flex;flex-direction:column;gap:0}
.aud-base{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--sigma-purple-soft);color:var(--sigma-purple);font-weight:800;font-size:13.5px}
.aud-join{display:flex;align-items:center;gap:8px;padding:6px 0 6px 22px;position:relative}
.aud-join::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--line)}
.aud-join .seg{position:relative;z-index:1;background:#fff;box-shadow:var(--e1)}
.aud-join .seg button{height:26px;font-size:11.5px;padding:0 10px}
.cond{display:grid;grid-template-columns:minmax(0,1fr) 130px minmax(0,1.2fr) 34px;gap:8px;align-items:center;padding:10px;border-radius:14px;background:#fff;box-shadow:var(--e1)}
.cond .sel,.cond .in{height:38px}
.aud-reach{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;background:var(--navy);color:#fff}
.aud-reach b{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.aud-reach small{color:#C9CFE0;font-size:12.5px}
.aud-faces{display:flex}
.aud-faces .av{box-shadow:0 0 0 2px var(--navy);margin-left:-8px}
.aud-faces .av:first-child{margin-left:0}

/* Vista previa de campaña */
.devices{display:flex;justify-content:center;padding:24px;border-radius:18px;background:repeating-linear-gradient(45deg,#EEF1F7 0 10px,#F4F6FA 10px 20px)}
.dev{background:#fff;border-radius:16px;box-shadow:var(--e3);overflow:hidden;transition:width .3s;max-width:100%}
.dev.desktop{width:880px}.dev.tablet{width:560px}.dev.mobile{width:340px}
.dev .bar{height:34px;background:var(--surface-2);display:flex;align-items:center;gap:6px;padding:0 12px;box-shadow:0 1px 0 var(--line)}
.dev .bar i{width:9px;height:9px;border-radius:50%;background:#DDE2EC}
.mini{display:grid;grid-template-columns:120px minmax(0,1fr);min-height:360px;position:relative}
.dev.mobile .mini,.dev.tablet .mini{grid-template-columns:minmax(0,1fr)}
.dev.mobile .mini .ms,.dev.tablet .mini .ms{display:none}
.mini .ms{background:var(--navy);padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.mini .ms span{height:9px;border-radius:5px;background:#2A3456}
.mini .ms span.on{background:var(--sigma-purple)}
.mini .mc{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.mini .sk{height:10px;border-radius:5px;background:#EEF1F6}
.mini .skc{height:70px;border-radius:12px;background:#F4F6FA}
.pv-banner{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--sigma-purple);color:#fff;font-size:12.5px}
.pv-banner b{display:block;font-size:13px}
.pv-banner .btn{background:#fff;color:var(--sigma-purple);height:30px;font-size:12px;margin-left:auto}
.pv-scrim{position:absolute;inset:0;background:rgba(20,27,51,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.pv-modal{width:min(360px,100%);background:#fff;border-radius:16px;box-shadow:var(--e3);overflow:hidden}
.pv-modal .im{height:120px;position:relative;overflow:hidden}
.pv-modal .im svg{position:absolute;inset:0;width:100%;height:100%}
.pv-modal .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.pv-modal h4{font-size:15px;font-weight:800}
.pv-modal p{font-size:12.5px;color:var(--muted)}
.pv-card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px;border-radius:14px;background:#fff;box-shadow:var(--e2)}
.pv-notif{position:absolute;right:12px;top:8px;width:min(300px,calc(100% - 24px));background:#fff;border-radius:14px;box-shadow:var(--e3);padding:10px}

/* Centro de ayuda */
.hhero{background:var(--navy);border-radius:22px;padding:30px 32px;color:#fff;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hhero h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.hhero p{color:#C9CFE0;font-size:14px}
.hsearch{position:relative;max-width:640px}
.hsearch input{width:100%;height:52px;border:0;border-radius:14px;padding:0 16px 0 48px;font-size:15px;background:#fff;color:var(--ink)}
.hsearch input:focus{outline:3px solid rgba(22,198,201,.45)}
.hsearch .ic{position:absolute;left:16px;top:17px;color:var(--muted)}
.hsug{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:#C9CFE0;align-items:center}
.hsug button{height:28px;padding:0 10px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600}
.hsug button:hover{background:rgba(255,255,255,.18)}
.hres{position:absolute;z-index:70;left:0;right:0;top:58px;background:#fff;border-radius:14px;box-shadow:var(--e3);padding:6px;color:var(--ink);max-height:360px;overflow:auto}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:0;border-radius:16px;background:#fff;box-shadow:var(--e1);text-align:left}
.cat:hover{box-shadow:var(--e2)}
.cat .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.cat b{font-size:13.5px;font-weight:800}
.cat small{font-size:12px;color:var(--muted)}
.kc{display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:var(--e1);overflow:hidden;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.kc:hover{box-shadow:var(--e2)}
.kc .th{position:relative;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}
.kc .th svg.bg{position:absolute;inset:0;width:100%;height:100%}
.kc .th .play{position:relative;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:var(--sigma-purple);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.kc .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(20,27,51,.8);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.kc .th .kind{position:absolute;left:8px;top:8px}
.kc .th .doc{position:relative;width:64px;height:80px;border-radius:6px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:5px;padding:12px 10px}
.kc .th .doc span{height:4px;border-radius:2px;background:#E2E7F0}
.kc .th .doc em{position:absolute;bottom:-6px;right:-8px;font-style:normal;font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:1px 6px}
.kc .kb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.kc h3{font-size:14px;font-weight:700;line-height:1.35}
.kc .km{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-top:auto}
.kc .km span{display:inline-flex;align-items:center;gap:4px}
.player{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0B1020;color:#fff}
.player svg.bg{position:absolute;inset:0;width:100%;height:100%}
.player .ctr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.player .bigplay{width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--sigma-purple);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.player .pbar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:12px}
.player .pt{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);position:relative}
.player .pt span{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sigma-cyan)}
.player .chap{position:absolute;left:14px;top:14px;background:rgba(20,27,51,.72);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.stepsl{display:flex;flex-direction:column;gap:6px}
.stepsl button{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-radius:12px;background:var(--surface-2);text-align:left}
.stepsl button:hover{background:#fff;box-shadow:var(--e1)}
.stepsl button.on{background:var(--sigma-purple-soft)}
.stepsl .n{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:var(--sigma-purple);box-shadow:var(--e1)}
.stepsl b{font-size:13.5px}
.stepsl small{display:block;font-size:12px;color:var(--muted)}
.stepsl time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ver{display:flex;flex-direction:column}
.ver-i{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:10px 0;position:relative}
.ver-i + .ver-i{border-top:1px solid var(--line)}
.ver-i .v{height:26px;border-radius:8px;background:var(--canvas);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ver-i.cur .v{background:var(--sigma-purple);color:#fff}
.ver-i b{font-size:13px}
.ver-i small{display:block;font-size:12px;color:var(--muted)}
.cascade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.casc-col{background:var(--surface-2);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;min-height:220px}
.casc-col h4{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.casc-col button{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;text-align:left;color:var(--ink-2)}
.casc-col button:hover{background:#fff}
.casc-col button[aria-pressed="true"]{background:#fff;color:var(--sigma-purple);box-shadow:var(--e1);font-weight:800}
.casc-col button .ic:last-child{margin-left:auto;opacity:.5}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px 14px;border-radius:14px;background:var(--sigma-purple-soft);font-size:13px;font-weight:700;color:var(--sigma-purple)}
.path i{font-style:normal;opacity:.5}

/* Ayuda contextual, notificaciones, popovers */

function reach(conds, join){
  if (!conds.length) return POP.reduce((s, g) => s + g.n, 0);
  const fac = g => conds.map(([f, op, v]) => {
    if (f === 'usuario'){ const p = Object.values(PEOPLE).find(x => x.n === v); const hit = p && p.cliente === g.cliente && p.planta === g.planta && p.perfil && norm(p.perfil).startsWith(norm(g.perfil).slice(0, 5)) && g.estado === 'Activo'; return op === '=' ? (hit ? 1 / g.n : 0) : 1; }
    if (f === 'modulo'){ const has = (PERF_MODS[g.perfil] || []).includes(v); return (op === '=') === has ? 1 : 0; }
    if (f === 'grupo'){ const r = GROUPS[v] || 0; return op === '=' ? r : 1 - r; }
    const hit = g[f] === v; return (op === '=') === hit ? 1 : 0;
  });
  const sum = POP.reduce((s, g) => { const fs = fac(g); const f = join === 'OR' ? Math.min(1, fs.reduce((a, b) => a + b, 0)) : fs.reduce((a, b) => a * b, 1); return s + g.n * f; }, 0);
  return Math.round(sum);
}

function hbars(list, o = {}){
  const max = Math.max(1, ...list.map(x => x.v));
  return `<div class="hb">${list.map(x => `<div class="hb-r" data-tip="<b>${esc(x.l)}</b><br>${num(x.v)} ${o.unit || 'tickets'}${x.extra ? '<br>' + x.extra : ''}" tabindex="0"><span class="lb">${esc(x.l)}</span><span class="tr"><span style="width:${Math.max(1.5, x.v / max * 100)}%;${x.c ? 'background:' + x.c : ''}"></span></span><span class="v">${num(x.v)}${o.suffix || ''}</span></div>`).join('')}</div>`;
}
function lineChart(series, labels, o = {}){
  const H = o.h || 200, PH = H - 26; const all = series.flatMap(s => s.d); const max = Math.max(1, ...all) * 1.15; const n = labels.length;
  const X = i => i / (n - 1) * 100, Y = v => (1 - v / max) * 100;
  const ticks = [0, .5, 1].map(f => Math.round(max * f / 1.15));
  const grid = ticks.map(t => `<line x1="0" x2="100" y1="${Y(t)}" y2="${Y(t)}" stroke="#EDF0F5" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  const paths = series.map(s => `<path d="${s.d.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y(v).toFixed(2)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`).join('');
  const area = o.area && series[0] ? `<path d="${series[0].d.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y(v).toFixed(2)).join(' ')} L100 100 L0 100Z" fill="${series[0].c}" opacity=".08"/>` : '';
  const step = Math.ceil(n / 6);
  const xl = labels.map((l, i) => (i % step === 0 || i === n - 1) && !(i !== n - 1 && n - 1 - i < step / 2) ? `<span style="position:absolute;left:${X(i)}%;transform:translateX(${i === 0 ? '0' : i === n - 1 ? '-100%' : '-50%'});white-space:nowrap">${l}</span>` : '').join('');
  const hits = labels.map((l, i) => `<span class="lc-hit" style="left:${Math.max(0, X(i) - 50 / (n - 1))}%;width:${100 / (n - 1)}%" data-cx="${X(i)}" data-tip="<b>${esc(l)}</b>${series.map(s => `<br><span style='color:${s.c}'>●</span> ${esc(s.l)}: ${num(s.d[i])}`).join('')}"></span>`).join('');
  const dots = series.map(s => `<span class="lc-dot" style="left:${X(n - 1)}%;top:${Y(s.d[n - 1])}%;background:${s.c}"></span>`).join('');
  return `<div class="lc" role="img" aria-label="${esc(o.label || 'Gráfico de líneas')}"><div class="lc-y" style="height:${PH}px">${ticks.map(t => `<span style="top:${Y(t)}%">${t}</span>`).join('')}</div>
    <div><div class="lc-plot" style="height:${PH}px"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${grid}${area}${paths}</svg>${dots}<span class="lc-xh"></span>${hits}</div><div class="lc-x">${xl}</div></div></div>`;
}

document.addEventListener('mouseout', e => { const r = e.target.closest && e.target.closest('[data-cx]'); if (r){ const xh = r.parentElement.querySelector('.lc-xh'); xh && (xh.style.opacity = 0); } });
function spark(d, c = 'var(--sigma-purple)', w = 96, h = 28){ const max = Math.max(1, ...d), X = i => i * (w - 4) / (d.length - 1) + 2, Y = v => h - 3 - v / max * (h - 6);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(d.length - 1)}" cy="${Y(d[d.length - 1])}" r="3" fill="${c}"/></svg>`; }

  const body = [kwInfo, kwContent, kwPlace, kwAud, kwPub][st - 1](d);

    case 'recur': openRecur(id); break;
    case 'fromrecur': { const r = RECUR.find(x => x.id === id); closeLayer(); startKB({t:r.id === 'r1' ? 'Cómo cerrar una OT con recepción parcial' : 'Cómo resolver: ' + r.t, kind:ds.kind || 'capsula', desc:`${r.causa} Esta ${ds.kind === 'guia' ? 'guía' : 'cápsula'} explica cómo evitarlo.`, obj:`Que el usuario pueda resolver «${r.t}» sin crear un ticket.`, path:[...r.path], recs:[r.causa]}, r.id); break; }
    case 'doresolve': { const t = TK(id); const note = $('#resN').value.trim(); closeLayer(); setState(t, 'res', note); break; }
    case 'doclose': { const t = TK(id); closeLayer(); setState(t, 'cer'); break; }
    case 'asuser': S.persona = 'usr'; save(); go('uticket', id); break;
    case 'feedback': openFeedback(id); break;
    case 'fbsend': sendFeedback(!!ds.reopen); break;
    case 'send': { const t = TK(id); const txt = $('#tdText').value.trim(); if (!txt){ $('#tdText').focus(); return; } const ask = $('#tdAsk') && $('#tdAsk').checked;
      t.ev.push({k:TD.mode === 'int' ? 'int' : ask ? 'req' : 'com', at:new Date(NOW), by:ME_SUP, txt, kb:TD.kb}); if (ask && t.st !== 'esp'){ t.ev.push({k:'st', at:new Date(NOW), by:ME_SUP, from:t.st, to:'esp'}); t.st = 'esp'; } t.upd = new Date(NOW); TD.draft = ''; TD.kb = null; save(); renderView(); toast(TD.mode === 'int' ? 'Nota interna guardada' : 'Respuesta enviada al usuario'); break; }
    case 'usend': { const t = TK(id); const txt = $('#tdText').value.trim(); if (!txt){ $('#tdText').focus(); return; } t.ev.push({k:'com', at:new Date(NOW), by:ME_USER, txt}); if (t.st === 'esp'){ t.ev.push({k:'st', at:new Date(NOW), by:'sys', from:'esp', to:'ana'}); t.st = 'ana'; } t.upd = new Date(NOW); t.unread = true; save(); renderView(); toast('Enviado. Soporte ya lo vio.'); break; }
    case 'sharekb': { TD.mode = 'pub'; const k = KB(id); TD.draft = `Te dejo «${k.t}» (${KIND[k.kind].l.toLowerCase()}), te va a servir.`; TD.kb = id; renderView(); setTimeout(() => { const ta = $('#tdText'); ta && (ta.scrollIntoView({block:'center'}), ta.focus()); }, 30); break; }
    case 'attach': toast('Elige el archivo (en SIGMA abre el selector).'); break;
    case 'sugview': RP.sugSeen = true; S.tickets.length; toast('Abrimos la cápsula en una pestaña. Tu reporte sigue aquí.'); refreshReport(); break;
    case 'sugcontinue': RP.sugDismissed = 'continued'; refreshReport(); setTimeout(() => $('#rpD') && $('#rpD').focus(), 20); break;
    case 'sugsolved': closeLayer(); toast('¡Bien! Registramos que la ayuda resolvió tu duda sin crear un ticket.'); break;
    case 'sendreport': sendReport(); break;
    case 'camp': closePop(); openCamp(id); break;
    case 'newcamp': startCampaign(); break;
    case 'campedit': closeLayer(); startCampaign(CP(id)); break;
    case 'campdup': { const c = CP(id); closeLayer(); startCampaign({...c, t:c.t + ' (copia)', id:null}); CW.editing = null; break; }
    case 'camppause': CP(id).st = 'pausada'; save(); closeLayer(); renderView(); toast('Campaña pausada', () => { CP(id).st = 'activa'; save(); renderView(); }); break;
    case 'campresume': CP(id).st = 'activa'; save(); closeLayer(); renderView(); toast('Campaña reanudada'); break;
    case 'condadd': CW.d.conds.push(['perfil','=','Bodeguero']); renderView(); break;
    case 'saveseg': toast('Segmento guardado. Lo verás en «Segmentos guardados».'); break;
    case 'cwdraft': { readCW(); const d = CW.d; const c = {id:CW.editing || 'c' + (++S.cseq), st:'borrador', tipo:d.tipo, t:d.t || 'Campaña sin título', d:d.desc, reach:0, vis:0, inter:0, from:null, to:null, fmt:d.fmt, cta:d.cta, conds:d.conds, join:d.join, freq:d.freq, theme:d.theme, kb:d.kb}; if (CW.editing){ Object.assign(CP(CW.editing), c); } else S.camp.unshift(c); save(); CF.tab = 'borrador'; CW.d = null; go('campaigns'); toast('Borrador guardado'); break; }
    case 'cwpublish': readCW(); confirmModal(CW.d.when === 'now' ? '¿Publicar la campaña?' : '¿Programar la campaña?', `«${esc(CW.d.t)}» llegará a ${num(reach(CW.d.conds, CW.d.join))} usuarios.`, CW.d.when === 'now' ? 'Publicar' : 'Programar', 'docwpublish', '', false); break;
    case 'docwpublish': publishCampaign(); break;
    case 'promote': { const k = KB(id); startCampaign(null, {t:(k.kind === 'capsula' ? 'Nueva cápsula: ' : '') + k.t, desc:k.desc, tipo:'tutorial', kb:id, cta:{a:['capsula','video'].includes(k.kind) ? 'capsula' : 'documento', l:'Ver ' + KIND[k.kind].l.toLowerCase(), dest:id}}); break; }
    case 'newkb': startKB(ds.q ? {t:'Cómo ' + ds.q} : null); break;
    case 'editkb': { const k = KB(id); startKB({t:k.t, kind:k.kind, desc:k.desc, obj:k.obj || '', steps:k.steps.length ? k.steps.map(s => [...s]) : [['Abrir la pantalla','0:00']], recs:k.recs.length ? [...k.recs] : [''], path:[...k.path, '', '', ''].slice(0, 4), ver:'v' + (parseFloat(k.ver.slice(1)) + .1).toFixed(1), notes:''}); break; }
    case 'newver': { const k = KB(id); const nv = 'v' + (parseFloat(k.ver.slice(1)) + .1).toFixed(1); openModal(`<div class="modal-h"><span class="ico tone-c" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none">${ic('history', 22)}</span><div style="flex:1"><h2>Nueva versión de «${esc(k.t)}»</h2><p>La versión actual queda en el historial.</p></div></div><div class="modal-b"><label class="drop" data-drop="ver"><span class="di">${ic('upload', 20)}</span><span class="dt"><b>Archivo actualizado</b>${k.fmt}</span><span class="btn out sm">Elegir</span><input type="file" class="sr"></label><div class="fg"><div class="f"><label for="nvV">Versión</label><input class="in" id="nvV" value="${nv}"></div><div class="f"><label for="nvN">Qué cambió</label><input class="in" id="nvN" placeholder="Ej.: Nuevo mapa 3D" autofocus></div></div></div><div class="modal-f"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="donewver" data-id="${id}">Publicar versión</button></div>`); break; }
    case 'donewver': { const k = KB(id); const v = $('#nvV').value.trim() || k.ver; const n = $('#nvN').value.trim() || 'Actualización'; k.versions.unshift([v, new Date(NOW), ME_SUP, n]); k.ver = v; k.upd = new Date(NOW); save(); closeLayer(); renderView(); toast(`Versión ${v} publicada`); break; }
    case 'versions': openVersions(id); break;
    case 'restorever': confirmModal(`¿Restaurar ${ds.v}?`, 'Se publicará como una versión nueva con el contenido de esa versión.', 'Restaurar', 'dorestore', id + '|' + ds.v, false); break;
    case 'dorestore': { const [kid, v] = id.split('|'); const k = KB(kid); const nv = 'v' + (parseFloat(k.ver.slice(1)) + .1).toFixed(1); k.versions.unshift([nv, new Date(NOW), ME_SUP, `Restaurada desde ${v}`]); k.ver = nv; save(); closeLayer(); renderView(); toast(`Se restauró ${v} como ${nv}`); break; }
    case 'gotoscreen': if (isUser() || KB(id).path[0] === 'Inventario'){ S.persona = 'usr'; save(); go('uloc'); setTimeout(() => openCtxHelp(document.querySelector('.mock-h [data-act="ctxhelp"]')), 450); } else toast(`En SIGMA esto abre «${esc(KB(id).path.slice(-1)[0])}».`); break;
    case 'useful': toast(ds.v === '1' ? '¡Gracias! Nos ayuda a saber qué sirve.' : 'Gracias. ¿Quieres reportar tu duda? Usa «Reportar problema».'); break;
    case 'play': { const k = KB(R.id); if (PL.t >= secs(k.dur)) PL.t = 0; PL.playing = !PL.playing; renderView(); break; }
    case 'kwaddstep': readKW(); KW.d.steps.push(['', '']); renderView(); setTimeout(() => { const ins = $$('[data-kwstepn]'); ins.length && ins[ins.length - 1].focus(); }, 20); break;
    case 'kwaddrec': readKW(); KW.d.recs.push(''); renderView(); break;
    case 'kwsave': readKW(); saveKB(); break;
    case 'clearlf': LF.q = ''; LF.mod = ''; LF.st = ''; renderView(); break;
    case 'newcat': case 'editcat': openModal(`<div class="modal-h"><span class="ico tone-p" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none">${ic('folder', 22)}</span><div style="flex:1"><h2>${act === 'newcat' ? 'Nueva categoría' : 'Editar ' + esc(id)}</h2><p>Agrupa contenido del mismo módulo.</p></div></div><div class="modal-b"><div class="f"><label for="catN">Nombre</label><input class="in" id="catN" value="${act === 'editcat' ? esc(id) : ''}" placeholder="Ej.: Compras" autofocus></div><div class="f"><label for="catM">Módulo de SIGMA</label><select class="sel" id="catM">${MODS.map(m => `<option${m === id ? ' selected' : ''}>${m}</option>`).join('')}</select></div></div><div class="modal-f"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn pri" data-act="close" data-soon="Guardar categoría">Guardar</button></div>`); break;
    case 'bannerx': S.bannerOff = true; save(); renderView(); toast('Aviso cerrado. Lo encuentras en notificaciones.', () => { S.bannerOff = false; save(); renderView(); }); break;
    case 'openmodalcamp': openCampaignModalUser(); break;
    case 'demoempty': S.empty = !S.empty; save(); renderShell(); renderView(true); renderDemo(); break;
    case 'demoreset': { const p = S.persona; S = fresh(); S.persona = p; save(); go(R.page); renderDemo(); toast('Se restauró el ejemplo'); break; }
  }
});
function refreshReport(){ if (!$('#layer .drawer')) return; const ae = document.activeElement; const id = ae && ae.id; const sel = ae && ae.selectionStart; $('#layer .drawer').innerHTML = reportHTML(); if (id && $('#' + id)){ const el = $('#' + id); el.focus(); try { el.setSelectionRange(sel, sel); } catch(e){} } }
function sendReport(){
  const c = RP.ctx; const user = RP.onBehalf || c.user; const id = 'SUP-00' + (++S.seq);
  const t = {id, t:RP.t.trim(), cat:RP.cat, prio:RP.prio, st:'rep', user, mod:c.mod, pant:c.pant, reg:c.reg, resp:null, area:'Mesa de Ayuda', created:new Date(NOW), upd:new Date(NOW), desc:RP.d.trim() || RP.t.trim(), files:RP.files.filter(f => f.p >= 100).map(f => ({n:f.n, k:f.k, s:f.s})), unread:true, csat:null, recur:/cerrar.*ot/i.test(RP.t) ? 'r1' : null,
    ev:[{k:'rep', at:new Date(NOW), by:user, txt:RP.t.trim()}]};
  const sug = suggest(); if (sug.length && RP.sugDismissed) t.ev.push({k:'sys', at:new Date(NOW), by:'sys', txt:`Se sugirió «${sug[0].t}»${RP.sugSeen ? '; el usuario la abrió' : ''} y continuó con el reporte: la ayuda no resolvió el problema.`});
  if (t.files.length) t.ev.push({k:'file', at:new Date(NOW), by:user, txt:`Adjuntó ${t.files.length} ${t.files.length === 1 ? 'archivo' : 'archivos'}.`, file:t.files[0]});
  S.tickets.unshift(t); save(); RP.done = id; $('#layer .drawer').innerHTML = reportHTML(); if (R.page === 'tickets' || R.page === 'hub' || R.page === 'umine') renderView();
}
function readCW(){ if (!CW.d) return; $$('[data-cw]').forEach(el => { CW.d[el.dataset.cw] = el.type === 'number' ? +el.value : el.value; }); $$('[data-cwcta]').forEach(el => { CW.d.cta[el.dataset.cwcta] = el.value; }); }
function readKW(){ if (!KW.d) return; $$('[data-kw]').forEach(el => { KW.d[el.dataset.kw] = el.value; }); $$('[data-kwstepn]').forEach(el => { KW.d.steps[+el.dataset.kwstepn][0] = el.value; }); $$('[data-kwstept]').forEach(el => { KW.d.steps[+el.dataset.kwstept][1] = el.value; }); $$('[data-kwrec]').forEach(el => { KW.d.recs[+el.dataset.kwrec] = el.value; }); }
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'tq'){ TF.q = t.value; const pos = t.selectionStart; renderView(); const n = $('#tq'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'lq'){ LF.q = t.value; const pos = t.selectionStart; renderView(); const n = $('#lq'); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === 'hq'){ HQ.q = t.value; showHres(); }
  if (t.id === 'gq') gsearch(t.value);
  if (t.dataset.rp){ if (t.dataset.rp === 't' || t.dataset.rp === 'd'){ RP[t.dataset.rp] = t.value; const s = RP.sugDismissed ? [] : suggest(); const box = $('#rpSug'); if (box){ const had = box.innerHTML; box.innerHTML = sugHTML(s); } updRpFoot(); } else { RP.ctx[t.dataset.rp] = t.value; } }
  if (t.dataset.cw === 't'){ CW.d.t = t.value; const h = t.parentElement.querySelector('.hint'); h && (h.textContent = `${t.value.length}/70 · Se lee en un vistazo.`); const nb = document.querySelector('.wz-foot .btn.pri'); nb && (nb.disabled = !t.value.trim()); const pv = document.querySelector('.pv-modal h4'); pv && (pv.textContent = t.value || 'Título de la campaña'); }
  if (t.dataset.cw === 'desc'){ CW.d.desc = t.value; const pv = document.querySelector('.pv-modal .tx p'); pv && (pv.textContent = t.value || 'La descripción aparece aquí.'); }
  if (t.dataset.cwcta === 'l'){ CW.d.cta.l = t.value; }
  if (t.dataset.kw === 't'){ KW.d.t = t.value; const nb = document.querySelector('.wz-foot .btn.pri'); nb && (nb.disabled = t.value.trim().length < 3); }
});
function updRpFoot(){ const ok = RP.t.trim() && RP.cat && RP.prio && (isUser() || RP.onBehalf); const b = $('[data-act="sendreport"]'); b && (b.disabled = !ok); }
document.addEventListener('change', e => {
  const t = e.target; const ds = t.dataset;
  if (ds.condf != null){ const i = +ds.condf; CW.d.conds[i] = [t.value, '=', AF[t.value].v[0]]; renderView(); }
  if (ds.condo != null){ CW.d.conds[+ds.condo][1] = t.value; renderView(); }
  if (ds.condv != null){ CW.d.conds[+ds.condv][2] = t.value; renderView(); }
  if (ds.cw && t.tagName === 'SELECT'){ readCW(); renderView(); }
  if (ds.cwcta === 'a'){ readCW(); const first = {modulo:MODS[0], pantalla:'Gestión de ubicaciones', documento:'k2', capsula:'k1', url:'https://', nada:''}[t.value]; CW.d.cta.dest = first; CW.d.cta.l = {modulo:'Abrir módulo', pantalla:'Abrir pantalla', documento:'Ver documento', capsula:'Ver cápsula', url:'Abrir enlace', nada:''}[t.value]; renderView(); }
  if (ds.cwcta === 'dest'){ CW.d.cta.dest = t.value; }
  if (ds.cw === 'from' || ds.cw === 'fromT' || ds.cw === 'to' || ds.cw === 'every'){ readCW(); renderView(); }
  if (ds.rp === 'onBehalf'){ RP.onBehalf = t.value; refreshReport(); }
  if (ds.rpfiles && t.files.length){ addFiles(t.files, RP.files, () => { const box = $('#rpFiles'); box && (box.innerHTML = RP.files.map(fileRow).join('')); }); t.value = ''; }
  if (ds.kwfiles && t.files.length){ readKW(); addFiles(t.files, KW.d.files, () => { if (R.page === 'kwiz' && KW.step === 2){ const box = document.querySelector('.drop[data-drop="kw"] + .files'); box && (box.innerHTML = KW.d.files.map(fileRow).join('')); } }); t.value = ''; }
  if (ds.lf){ LF[ds.lf] = t.value; renderView(); }
  if (ds.cwupload && t.files.length){ toast('Imagen cargada para la campaña.'); }
  if (t.closest('.fmenu')){ const k = t.closest('.fmenu').dataset.k; TF.f[k] = $$('.fmenu input:checked').map(x => x.value); const anchor = document.querySelector(`[data-filt="${k}"]`); renderView(); const na = document.querySelector(`[data-filt="${k}"]`); na && openFmenu(k, na); }
});
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !e.dataTransfer || (ev !== 'dragleave' && ![...(e.dataTransfer.types || [])].includes('Files'))) return;
  e.preventDefault(); z.classList.toggle('is-over', ev === 'dragover');
  if (ev === 'drop'){ const which = z.dataset.drop; if (which === 'rp') addFiles(e.dataTransfer.files, RP.files, () => { const box = $('#rpFiles'); box && (box.innerHTML = RP.files.map(fileRow).join('')); }); if (which === 'kw'){ readKW(); addFiles(e.dataTransfer.files, KW.d.files, () => { const box = document.querySelector('.drop[data-drop="kw"] + .files'); box && (box.innerHTML = KW.d.files.map(fileRow).join('')); }); } }
}));
/* Reordenar pasos con arrastrar y soltar */
let dragI = null;
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('[data-kwdrag]'); if (r){ dragI = +r.dataset.kwdrag; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragI)); } catch(err){} r.style.opacity = '.5'; } });
document.addEventListener('dragend', e => { const r = e.target.closest && e.target.closest('[data-kwdrag]'); if (r) r.style.opacity = ''; });
document.addEventListener('dragover', e => { const r = e.target.closest && e.target.closest('[data-kwdrag]'); if (r && dragI != null){ e.preventDefault(); } });
document.addEventListener('drop', e => { const r = e.target.closest && e.target.closest('[data-kwdrag]'); if (r && dragI != null){ e.preventDefault(); readKW(); const to = +r.dataset.kwdrag; const [m] = KW.d.steps.splice(dragI, 1); KW.d.steps.splice(to, 0, m); dragI = null; renderView(); toast('Pasos reordenados'); } });
/* Menú de filtros */
let fmenu = null;
function openFmenu(k, anchor){
  closeFmenu(); const def = FILTERS.find(f => f[0] === k); const cur = TF.f[k] || [];
  fmenu = document.createElement('div'); fmenu.className = 'fmenu'; fmenu.dataset.k = k; fmenu.setAttribute('role', 'group'); fmenu.setAttribute('aria-label', def[1]);
  fmenu.innerHTML = def[2]().map(([v, l]) => `<label><input type="checkbox" value="${esc(v)}"${cur.includes(v) ? ' checked' : ''}>${k === 'st' ? stChip(v) : k === 'prio' ? prChip(v) : esc(l)}</label>`).join('');
  document.body.appendChild(fmenu); const r = anchor.getBoundingClientRect(); fmenu.style.left = Math.min(innerWidth - fmenu.offsetWidth - 12, r.left) + 'px'; fmenu.style.top = (r.bottom + 6) + 'px'; fmenu.style.position = 'fixed';
  const f = fmenu.querySelector('input'); f && f.focus();
}
function closeFmenu(){ if (fmenu){ fmenu.remove(); fmenu = null; } }
function showHres(){ const box = $('#hres'); if (!box) return; const h = helpResults(HQ.q); box.innerHTML = h; box.hidden = !h; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (fmenu){ closeFmenu(); return; } if (popEl){ closePop(); return; } if ($('#layer').innerHTML){ closeLayer(); return; } const h = $('#hres'); if (h && !h.hidden){ h.hidden = true; return; } }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){ e.preventDefault(); $('#gq').focus(); }
});
addEventListener('scroll', () => { if (fmenu) closeFmenu(); }, {passive:true});

/* ---------- Control de demostración (datos de ejemplo / estados vacíos) ---------- */
function renderDemo(){
  let d = $('#demo'); if (!d){ d = document.createElement('div'); d.id = 'demo'; d.className = 'demo'; document.body.appendChild(d); }
  d.innerHTML = `<span>Prototipo</span><button class="btn ${S.empty ? 'pri' : 'plain'} xs" data-act="demoempty" aria-pressed="${S.empty}">${S.empty ? 'Ver con datos' : 'Ver estados vacíos'}</button><button class="btn plain xs" data-act="demoreset">Reiniciar</button>`;
}

/* ---------- Inicio ---------- */
if (isUser()) R.page = "uloc";
renderShell(); renderView(false); renderDemo();

})();
</script>
