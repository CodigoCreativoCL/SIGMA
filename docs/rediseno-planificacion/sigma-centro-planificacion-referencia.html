.drop.on{border-color:var(--sigma-cyan-dark);color:var(--ink);background:var(--sigma-cyan-soft)}
.drop:focus-within{box-shadow:0 0 0 3px rgba(22,198,201,.25)}
.ph2{width:44px;height:36px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.pk{max-height:none}
.pk-r .cbx{opacity:1}
.pkw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
.pk-o{display:block;width:100%;text-align:left;border:0;background:#fff;padding:10px 12px;border-top:1px solid var(--line3);color:inherit}
.pk-o:first-child{border-top:0}
.pk-o:hover{background:var(--hover)}
.pk-o.on{background:var(--sigma-purple-soft);box-shadow:inset 3px 0 0 var(--sigma-purple)}
.pk-o b{display:block;font-size:13px}
.pk-o small{display:block;font-size:11.5px;color:var(--muted)}
.pkv{position:sticky;top:0;border-radius:12px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:220px}
.pkv h4{font-size:15px;font-weight:800;line-height:1.3}
.pkv .facts > div{background:#fff}
.pkv .tg{align-self:flex-start}
.stp .x{display:flex;flex-direction:column;gap:2px}
.shc-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shc-h b{display:block;font-size:14px}
.shc-h small{display:block;font-size:12px;color:var(--muted)}
.shc-h .r{display:flex;gap:6px;margin-left:auto}
.pci2{width:38px;height:38px;border-radius:11px;background:var(--sigma-purple-soft);color:var(--sigma-purple);display:flex;align-items:center;justify-content:center;flex:none}
.shc-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line3)}
.shc-b > div > div{display:flex;gap:4px;flex-wrap:wrap}
.lb2{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cfm{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--amber-soft);font-size:12.5px;color:#7A3E00;cursor:pointer}
.npf{display:flex;flex-direction:column;gap:10px;padding:10px;width:320px;max-width:100%}
.npf > b{font-size:14px}
.ppt{padding:8px 10px 6px}
.ppt b{display:block;font-size:13px}
.ppt small{display:block;font-size:11.5px;color:var(--muted);max-width:300px;margin-top:2px}
.pp{max-width:min(380px,calc(100vw - 24px))}
.pp .mi2.sh2{align-items:flex-start}
.pp .mi2 span small{display:block;font-size:11.5px;color:var(--muted)}
.pp .mi2:disabled{opacity:.45;cursor:not-allowed}
.pp .mi2 .ic{flex:none}
.swc{display:grid;grid-template-columns:30px auto;column-gap:8px;align-items:center;min-width:160px}
.swc i{grid-row:span 2;width:30px;height:30px;border-radius:9px}
.swc b{font-size:12px}
.swc small{font-size:11px;color:var(--muted)}
.cov h3{text-wrap:balance}
.dpk[disabled]{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.empty .lnk{margin-top:2px}
@media (max-width:1100px){.pkw{grid-template-columns:minmax(0,1fr)}.pkv{position:static}}
@media (max-width:900px){
  .wk{grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}
  .mo{min-width:760px}
  .shc-b{grid-template-columns:minmax(0,1fr)}
  .legend .lh{margin-left:0}
  .exl .rw{grid-template-columns:24px minmax(0,1fr) auto!important;row-gap:4px}
  .exl .rw.h{display:none}
  .exl .rw > :nth-child(1){grid-row:span 3}
  .exl .rw > :nth-child(5){grid-column:3;grid-row:1}
  .exl .rw > :nth-child(3),.exl .rw > :nth-child(4){grid-column:2/4}
  .exl .rw > :nth-child(6){display:none}
  .exl .rw > :nth-child(7){grid-column:2/4;text-align:left!important}
  .ex-f .srch2{max-width:none!important}
}
@media (max-width:640px){
  .rows{overflow-x:auto}
  .sc .rows > .rw,.cov-l .rows > .rw{min-width:540px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .imp4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal-bar .sm{margin-left:0}
  .cov{grid-template-columns:minmax(0,1fr);justify-items:start}
}
.inp,.sel,.dpk,textarea.inp{font-family:inherit}
.stp textarea.inp{min-height:38px}
.gd{align-items:start}
.fi{container-type:inline-size;container-name:fi}
@container fi (max-width:900px){
  .fb{grid-template-columns:minmax(0,1fr)}
  .rdy{position:static;order:-1}
  .fq-ed{grid-template-columns:minmax(0,1fr)}
}
@container fi (max-width:820px){
  .grid4c{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid4c > .fld[style*="span 2"]{grid-column:1/-1!important}
  .ac-h{grid-template-columns:20px 48px minmax(0,1fr) auto 16px}
  .ac-h .fl{grid-column:3/5;grid-row:2}
  .ac-h .fl:empty{display:none}
  .sum{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container fi (max-width:560px){
  .scope,.grid3c,.grid4c,.blk .who{grid-template-columns:minmax(0,1fr)}
  .sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ac-b{padding-left:12px}
  .rp{grid-template-columns:minmax(0,1fr) 80px 40px 32px}
}
.fh-1 .acts{flex:none;justify-content:flex-end;max-width:100%}
.prc{flex-wrap:wrap}
.prc > div:nth-child(2){flex:1;min-width:200px}
.prc .r{flex-wrap:wrap}
.exl .dt small{white-space:normal}
@container fi (max-width:820px){
  .iv-h{grid-template-columns:auto minmax(0,1fr)}
  .iv-h .rt{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .iv-h .nd{text-align:left}
}
@media (max-width:560px){
  .kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpb{padding:10px 12px;gap:8px;align-items:flex-start}
  .kpb .i,.kpb .go{display:none}
  .kpb b{font-size:19px}
  .kpb small{font-size:11.5px}
  .ex-f .sel{flex:1 1 140px}
  .cp-h h1{font-size:21px}
}

.nb.g{background:rgba(255,255,255,.1);color:#D3D8E8}
body.enlarged .side.v2 .nb.g{background:#C9CFE0}
[hidden]{display:none!important}
</style>

          <div class="fld"><label>Duración estimada</label><div class="unit"><input class="inp${+i.dur > 0 ? '' : ' err'}" type="number" min="0.25" step="0.25" data-b="i:${i.code}.dur" data-ty="num" value="${i.dur}" ${E ? '' : 'disabled'}><span class="u">horas</span></div>${+i.dur > 0 ? '' : mc('', 'La duración debe ser mayor que 0.')}</div>

          <div class="fld" style="grid-column:1/-1"><label>Descripción <small>se copia a la OT</small></label><textarea class="inp" rows="2" data-b="i:${i.code}.desc" ${E ? '' : 'disabled'} placeholder="Qué debe saber el técnico antes de empezar">${esc2(i.desc)}</textarea></div></div></div>
      ${whenHTML(p, i, E)}
      ${actsHTML(p, i, E, sumA)}
      <div class="blk" id="who-${i.code}"><div class="blk-h"><h4>Quién</h4><small>Se aplica a cada OT que genere esta intervención</small></div>
        <div class="who"><div class="fld"><label>Responsable</label><select class="sel" data-b="i:${i.code}.resp" ${E ? '' : 'disabled'}><option value="">Sin responsable</option>${PEOPLE.map(x => `<option value="${x.id}"${i.resp === x.id ? ' selected' : ''}>${x.n} · ${x.r}</option>`).join('')}</select></div>
          <div class="fld"><label>Grupo de trabajo <small>opcional</small></label><select class="sel" data-b="i:${i.code}.grp" ${E ? '' : 'disabled'}><option value="">Sin grupo</option>${GROUPS.map(g => `<option value="${g.id}"${i.grp === g.id ? ' selected' : ''}>${g.n}</option>`).join('')}</select></div></div>
        <div class="whn">${i.resp ? ic('check', 14) + `<span>Cada OT nacerá asignada a <b>${esc2(person(i.resp).n)}</b> como responsable${i.grp ? ` y al grupo <b>${esc2(group(i.grp).n)}</b>` : ''}. El detalle se ajusta después en la OT.</span>` : `<span style="color:var(--amber);display:flex;gap:6px">${ic('alert', 14)}Sin responsable, las OT nacerán sin asignar y habrá que asignarlas una por una.</span>`}</div></div>
      ${E ? `<div style="display:flex;justify-content:flex-end">${isNew && !hasEx ? `<button type="button" class="btn dano xs" data-a="rmint" data-i="${i.code}">${ic('x', 14)}Quitar intervención</button>` : `<span class="msg i">${ic('help', 13)}<span>Ya generó ejecuciones: para dejar de usarla, deshabilítala con el interruptor.</span></span>`}</div>` : ''}
    </div>` : ''}
  </article>`;
}

/* ---- cuándo (editor de frecuencia) ---- */
function whenHTML(p, i, E) {
  const f = i.f, sh = i.sh && shared(i.sh), code = i.code, b = k => `f:${code}.${k}`;
  if (!f && !sh) return `<div class="blk err" id="when-${code}"><div class="blk-h"><h4>Cuándo</h4></div><div style="display:flex;flex-direction:column;gap:10px">${mc('', 'Esta intervención necesita una frecuencia para poder activarse.')}<div class="segc" role="group" aria-label="Tipo de frecuencia">${[['cal', 'Calendario'], ['int', 'Intervalo'], ['fec', 'Fechas puntuales'], ['med', 'Por medidor'], ['cond', 'Por condición']].map(([k, l]) => `<button type="button" data-a="ftype" data-i="${code}" data-v="${k}" ${E ? '' : 'disabled'}>${l}</button>`).join('')}</div>${E ? `<button type="button" class="lnk" data-a="useshared" data-i="${code}">${ic('link', 14)}O usar un calendario compartido de la Biblioteca</button>` : ''}</div></div>`;
  if (sh) { const u = sh.uses; return `<div class="blk" id="when-${code}"><div class="blk-h"><h4>Cuándo</h4></div><div class="fq-ed"><div class="fq-f"><div class="shrd"><span class="kpb p" style="padding:0;box-shadow:none;background:none"><span class="i">${ic('link', 18)}</span></span><div style="flex:1;min-width:0"><b style="font-size:13px">Calendario compartido «${esc2(sh.n)}»</b><div style="font-size:12px;color:var(--muted)">${sh.id} · usado por ${u.plans.length} ${u.plans.length === 1 ? 'plan' : 'planes'}, ${u.tareas.length} ${u.tareas.length === 1 ? 'tarea' : 'tareas'} y ${u.pautas.length} ${u.pautas.length === 1 ? 'pauta' : 'pautas'}</div></div></div>
    ${mc('i', 'Es de solo lectura aquí. Si lo cambias en la Biblioteca, cambia para todos los que lo usan.')}
    ${E ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn out xs" data-a="libcal" data-c="${sh.id}">Editar en Biblioteca</button><button type="button" class="btn ghost xs" data-a="ownfreq" data-i="${code}">Convertir en propia</button></div>` : ''}</div>${pvHTML(p, i)}</div></div>`; }
  const dis = E ? '' : 'disabled';
  const seg = (k, opts) => `<div class="segc" role="group">${opts.map(([v, l]) => `<button type="button" data-a="fset" data-b="${b(k)}" data-v="${v}" aria-pressed="${String(f[k]) === String(v)}" ${dis}>${l}</button>`).join('')}</div>`;
  const hours = Array.from({ length: 48 }, (_, k) => `${pad(Math.floor(k / 2))}:${k % 2 ? '30' : '00'}`);
  const hourSel = `<div class="fld"><label>Hora</label><select class="sel" data-b="${b('hour')}" ${dis}>${hours.map(h => `<option${f.hour === h ? ' selected' : ''}>${h}</option>`).join('')}</select></div>`;
  let body = '';
  if (f.t === 'cal') {
    const unit = { d: f.n == 1 ? 'día' : 'días', w: f.n == 1 ? 'semana' : 'semanas', m: f.n == 1 ? 'mes' : 'meses', y: f.n == 1 ? 'año' : 'años' }[f.rep];
    body = `<div class="fld"><span class="lb">Se repite</span>${seg('rep', [['d', 'Diaria'], ['w', 'Semanal'], ['m', 'Mensual'], ['y', 'Anual']])}</div>
      <div class="grid3c"><div class="fld"><label>Cada</label><div class="unit"><input class="inp" type="number" min="1" data-b="${b('n')}" data-ty="int" value="${f.n}" ${dis}><span class="u">${unit}</span></div></div>${hourSel}<div></div></div>
      ${f.rep === 'w' ? `<div class="fld"><span class="lb">Días</span><div class="days">${[1, 2, 3, 4, 5, 6, 7].map(d => `<button type="button" data-a="fday" data-i="${code}" data-v="${d}" aria-pressed="${(f.days || []).includes(d)}" ${dis} aria-label="${DIA[d]}">${DIAC[d]}</button>`).join('')}</div>${(f.days || []).length ? '' : mc('', 'Elige al menos un día de la semana.')}</div>` : ''}
      ${f.rep === 'm' ? `<div class="fld"><span class="lb">Qué día del mes</span>${seg('mmode', [['day', 'Un día fijo'], ['ord', 'Un día de la semana']])}</div>
        ${f.mmode === 'ord' ? `<div class="grid3c"><div class="fld"><label>Semana</label><select class="sel" data-b="${b('ord')}" data-ty="int" ${dis}>${[[1, 'Primer'], [2, 'Segundo'], [3, 'Tercer'], [4, 'Cuarto'], [-1, 'Último']].map(([v, l]) => `<option value="${v}"${+f.ord === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div><div class="fld"><label>Día</label><select class="sel" data-b="${b('wd')}" data-ty="int" ${dis}>${[1, 2, 3, 4, 5, 6, 7].map(d => `<option value="${d}"${+f.wd === d ? ' selected' : ''}>${DIA[d]}</option>`).join('')}</select></div></div>`
          : `<div class="grid3c"><div class="fld"><label>Día del mes</label><select class="sel" data-b="${b('md')}" data-ty="int" ${dis}>${Array.from({ length: 31 }, (_, k) => `<option value="${k + 1}"${+f.md === k + 1 ? ' selected' : ''}>${k + 1}</option>`).join('')}</select>${+f.md > 28 ? mc('i', 'En los meses más cortos se usa el último día.') : ''}</div></div>`}` : ''}
      ${f.rep === 'y' ? `<div class="grid3c"><div class="fld"><label>Mes</label><select class="sel" data-b="${b('month')}" data-ty="int" ${dis}>${MES.map((m, k) => `<option value="${k + 1}"${+f.month === k + 1 ? ' selected' : ''}>${m}</option>`).join('')}</select></div><div class="fld"><label>Día</label><select class="sel" data-b="${b('md')}" data-ty="int" ${dis}>${Array.from({ length: 31 }, (_, k) => `<option value="${k + 1}"${+f.md === k + 1 ? ' selected' : ''}>${k + 1}</option>`).join('')}</select></div></div>` : ''}`;
  }
  if (f.t === 'int') body = `<div class="grid3c"><div class="fld"><label>Cada</label><div class="unit"><input class="inp" type="number" min="1" data-b="${b('n')}" data-ty="int" value="${f.n}" ${dis}><select class="sel" data-b="${b('iu')}" ${dis}>${[['h', 'horas'], ['d', 'días'], ['w', 'semanas'], ['m', 'meses']].map(([v, l]) => `<option value="${v}"${f.iu === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div><div class="fld"><label>A partir de</label>${dpk(b('anchor'), f.anchor, dis)}</div>${hourSel}</div>`;
  if (f.t === 'fec') body = `<div class="fld"><span class="lb">Fechas</span><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${(f.dates || []).slice().sort().map(d => `<span class="fc" style="cursor:default">${fDY(d)}${E ? `<button type="button" class="ibx" style="width:22px;height:22px" data-a="rmdate" data-i="${code}" data-v="${d}" aria-label="Quitar ${fDY(d)}">${ic('x', 12)}</button>` : ''}</span>`).join('')}${E ? `<button type="button" class="btn out xs" data-a="cal" data-b="${b('dates')}" data-add="1">${ic('plus', 14)}Agregar fecha</button>` : ''}</div>${(f.dates || []).length ? '' : mc('', 'Agrega al menos una fecha.')}</div><div class="grid3c">${hourSel}</div>`;
  if (f.t === 'med') {
    const rows = p.eqs.map(e => { const a = asset(e.id), m = meterNext(f, a); return `<div><span><b>${a.id}</b> <small>${esc2(a.n)}</small></span>${m ? `<small>Lectura ${fN(a.med.cur)} h</small><b>${fN(m.thr)} h · ${rel(m.date)}</b>` : `<small style="color:var(--amber)">Sin medidor</small><b style="color:var(--amber)">Nunca generará</b>`}</div>`; }).join('');
    body = `<div class="grid3c"><div class="fld"><label>Cada</label><div class="unit"><input class="inp" type="number" min="1" data-b="${b('mn')}" data-ty="int" value="${f.mn}" ${dis}><span class="u">horas</span></div></div><div class="fld"><label>Desde la lectura</label><div class="unit"><input class="inp" type="number" min="0" data-b="${b('mstart')}" data-ty="int" value="${f.mstart}" ${dis}><span class="u">h</span></div></div><div class="fld"><label>Avisar antes</label><div class="unit"><input class="inp" type="number" min="0" data-b="${b('mwarn')}" data-ty="int" value="${f.mwarn}" ${dis}><span class="u">h</span></div></div></div>
      <div class="fld"><span class="lb">Medidor de cada activo del plan</span>${p.eqs.length ? `<div class="mtr">${rows}</div>` : mc('i', 'Agrega activos para ver cuándo se dispara en cada uno.')}</div>`;
  }
  if (f.t === 'cond') body = `<div class="shrd">${ic('trend', 18)}<div style="flex:1;min-width:0"><b style="font-size:13px">${f.ctext ? 'Cuando ' + esc2(f.ctext) : 'Sin condición definida'}</b><div style="font-size:12px;color:var(--muted)">Se dispara al registrar una medición que cumple la condición.</div></div>${E ? `<button type="button" class="btn out xs" data-a="condpanel" data-i="${code}">Editar condición</button>` : ''}</div>${f.ctext ? '' : mc('', 'Define la condición que dispara la intervención.')}`;
  const tolU = (k, l) => `<div class="fld"><label>${l}</label><div class="unit"><input class="inp" type="number" min="0" data-b="${b(k)}" data-ty="int" value="${f[k] || 0}" ${dis}><span class="u">días</span></div></div>`;
  const common = f.t === 'med' || f.t === 'cond' ? '' : `<div class="grid4c"><div class="fld"><label>Vigente desde</label>${dpk(b('from'), f.from, dis)}</div><div class="fld"><label>Hasta <small>opcional</small></label>${dpk(b('to'), f.to, dis, 'Sin fin')}</div>${tolU('tb', 'Puede hacerse antes')}${tolU('ta', 'Vence después de')}</div>
    <div class="fld"><span class="lb">Exclusiones <small>días en que no se programa</small></span><div class="exc">${(f.excl || []).map((x, k) => `<div class="exr"><span><b>${fDY(x.a)} – ${fDY(x.b)}</b> <small>· ${esc2(x.why)}</small></span><span class="tg">${x.eff === 'shift' ? 'Corre la fecha' : 'Omite la fecha'}</span>${E ? `<button type="button" class="ibx dn" data-a="rmexc" data-i="${code}" data-v="${k}" aria-label="Quitar exclusión">${ic('x', 14)}</button>` : '<span></span>'}</div>`).join('')}
      ${U.vp['exc-' + code] ? excForm(code) : E ? `<button type="button" class="btn plain xs" style="align-self:flex-start" data-a="addexc" data-i="${code}">${ic('plus', 14)}Agregar exclusión</button>` : ''}</div></div>`;
  return `<div class="blk" id="when-${code}"><div class="blk-h"><h4>Cuándo</h4><small>${f.t === 'med' ? 'Se dispara con las lecturas del horómetro' : 'Las fechas se recalculan mientras editas'}</small><div class="r">${E ? `<button type="button" class="lnk" data-a="useshared" data-i="${code}">${ic('link', 14)}Usar calendario compartido</button>` : ''}</div></div>
    <div class="fq-ed"><div class="fq-f"><div class="fld"><span class="lb">Tipo</span><div class="segc" role="group" aria-label="Tipo de frecuencia">${[['cal', 'Calendario'], ['int', 'Intervalo'], ['fec', 'Fechas puntuales'], ['med', 'Por medidor'], ['cond', 'Por condición']].map(([k, l]) => `<button type="button" data-a="ftype" data-i="${code}" data-v="${k}" aria-pressed="${f.t === k}" ${dis}>${l}</button>`).join('')}</div></div>${body}${common}</div>${pvHTML(p, i)}</div></div>`;
}
function excForm(code) {
  const v = U.vp['exc-' + code];
  return `<div class="exr" style="grid-template-columns:1fr;gap:10px;background:var(--surface-2)"><div class="grid4c"><div class="fld"><label>Desde</label>${dpk('x:' + code + '.a', v.a, '')}</div><div class="fld"><label>Hasta</label>${dpk('x:' + code + '.b', v.b, '')}</div><div class="fld" style="grid-column:span 2"><label>Motivo</label><input class="inp" data-xv="why" data-i="${code}" value="${esc2(v.why)}" placeholder="Ej.: Parada de planta de fin de año"></div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="segc">${[['shift', 'Correr la fecha al día siguiente'], ['omit', 'Omitir la fecha']].map(([k, l]) => `<button type="button" data-a="xeff" data-i="${code}" data-v="${k}" aria-pressed="${v.eff === k}">${l}</button>`).join('')}</div><span style="flex:1"></span><button type="button" class="btn plain xs" data-a="excx" data-i="${code}">Cancelar</button><button type="button" class="btn pri xs" data-a="excok" data-i="${code}">Agregar</button></div>
    ${v.err ? mc('', v.err) : ''}</div>`;
}
function dpk(bind, val, dis, ph) { return `<button type="button" class="dpk" data-a="cal" data-b="${bind}" ${dis || ''} aria-label="Elegir fecha">${ic('calw', 15)}<span class="${val ? '' : 'ph'}">${val ? fDY(val) : (ph || 'Elegir fecha')}</span>${val && ph ? `<span class="ibx" data-a="clrdate" data-b="${bind}" style="width:22px;height:22px;flex:none" aria-label="Quitar fecha">${ic('x', 12)}</span>` : ''}</button>`; }
function pvHTML(p, i) {
  const f = freqOf(i);
  let list = '';
  if (f.t === 'med') list = p.eqs.length ? p.eqs.map(e => { const a = asset(e.id), m = meterNext(f, a); return m ? `<div class="d">${ic('gauge', 14)}<span><b>${a.id}</b> al llegar a ${fN(m.thr)} h<small style="display:block;color:var(--muted)">≈ ${fDL(m.date)} · ${fN(a.med.rate)} h/día</small></span></div>` : `<div class="d x">${ic('alert', 14)}<span><s>${a.id}</s><small>Sin medidor: nunca generará</small></span></div>`; }).join('') : '<div class="d x"><span></span><span>Sin activos</span></div>';
  else if (f.t === 'cond') list = `<div class="d">${ic('trend', 14)}<span>${f.ctext ? 'Cuando ' + esc2(f.ctext) : 'Define la condición'}</span></div>`;
  else { const ds = nextDates(f, 6); list = ds.length ? ds.map(x => x.x ? `<div class="d x">${ic('x', 14)}<span><s>${fDL(x.d)}</s><small>Excluida: ${esc2(x.why)}</small></span></div>` : `<div class="d${x.orig ? ' sh' : ''}">${ic('check', 14)}<span>${fDL(x.d)}${x.orig ? `<small>Corrida desde el ${fD(x.orig)} · ${esc2(x.why)}</small>` : ''}</span></div>`).join('') : `<div class="d x">${ic('alert', 14)}<span>Sin fechas próximas con esta configuración</span></div>`; }
  const tol = f.t === 'med' || f.t === 'cond' ? `Avisa ${fN(f.mwarn || 0)} h antes.` : `Disponible desde ${f.tb || 0} ${f.tb == 1 ? 'día' : 'días'} antes · vence ${f.ta || 0} ${f.ta == 1 ? 'día' : 'días'} después.`;
  return `<div class="pv" id="pv-${i.code}" aria-live="polite"><h5>${f.t === 'med' ? 'Próximos disparos' : 'Próximas fechas'}</h5><div class="nl">${esc2(freqText(f, true))}</div>${list}<div class="ft">${tol}${p.eqs.length > 1 && f.t !== 'med' ? ` Se repite en los ${p.eqs.length} activos.` : ''}</div></div>`;
}

/* ---- actividades ---- */
function actsHTML(p, i, E, sumA) {
  const code = i.code, open = U.oa[p.id + i.code];
  const dsum = i.acts.length ? `<div class="dsum">${ic('clock', 14)}<span>Las actividades suman <b>${fH(sumA)}</b>; la intervención estima <b>${fH(+i.dur || 0)}</b>.</span>${Math.abs(sumA - i.dur) > .01 ? `<span class="w">La OT usará ${fH(+i.dur || 0)}.</span>` : ''}</div>` : '';
  return `<div class="blk" id="acts-${code}"><div class="blk-h"><h4>Qué se hace</h4><small>Cada actividad es un paso de la OT</small><div class="r">${E ? `<button type="button" class="btn out xs" data-a="pickproc" data-i="${code}" data-new="1">${ic('clip', 14)}Agregar desde procedimiento</button><button type="button" class="btn out xs" data-a="addact" data-i="${code}">${ic('plus', 14)}Agregar actividad</button>` : ''}</div></div>
    ${i.acts.length ? `<div class="acts" data-dropz="${code}">${i.acts.map((a, k) => acHTML(p, i, a, k, E, open === a.code)).join('')}</div>${dsum}` : `<div class="empty" style="padding:16px">${ic('wrench', 18)}<span>Sin actividades, la OT tendrá un solo paso: «${esc2(i.n)}». Agrega actividades para guiar al técnico.</span></div>`}
  </div>`;
}
function acHTML(p, i, a, k, E, open) {
  const pr = a.proc && proc(a.proc), bp = x => `a:${i.code}:${a.code}.${x}`, dis = E ? '' : 'disabled';
  const permErr = a.perm && !a.permT;
  return `<div class="ac${open ? ' open' : ''}" data-ac="${a.code}" data-i="${i.code}" ${E ? 'draggable="true"' : ''}>
    <div class="ac-h" data-a="toggleact" data-i="${i.code}" data-c="${a.code}" role="button" tabindex="0" aria-expanded="${open}">
      <span class="gr" title="Arrastra para ordenar" aria-hidden="true">${ic('dots', 15)}</span><code>${a.code}</code>
      <div class="nm"><b>${esc2(a.n) || '<span style="color:var(--red)">Sin nombre</span>'}</b><small>${pr ? `<span class="tg p">${ic('clip', 11)}${pr.id} v${pr.v} · ${pr.steps.length} pasos</span>` : '<span>Sin procedimiento</span>'}${a.reps.length ? `<span>· ${a.reps.length} ${a.reps.length === 1 ? 'repuesto' : 'repuestos'}</span>` : ''}</small></div>
      <span class="du">${fH(+a.dur || 0)}</span>
      <span class="fl">${a.oblig ? '' : '<span class="tg">Opcional</span>'}${a.parada ? '<span class="tg w">Parada</span>' : ''}${a.perm ? `<span class="tg ${permErr ? 'w' : ''}">${permErr ? ic('alert', 11) : ''}Permiso</span>` : ''}</span>
      <span class="chev" style="color:var(--muted);transition:transform .2s;${open ? 'transform:rotate(90deg)' : ''}">${ic('chev', 15)}</span>
    </div>
    ${open ? `<div class="ac-b">
      <div class="grid3c"><div class="fld" style="grid-column:span 2"><label>Nombre</label><input class="inp${a.n.trim() ? '' : ' err'}" data-b="${bp('n')}" value="${esc2(a.n)}" ${dis}>${a.n.trim() ? '' : mc('', 'La actividad necesita un nombre.')}</div><div class="fld"><label>Duración</label><div class="unit"><input class="inp" type="number" min="0.25" step="0.25" data-b="${bp('dur')}" data-ty="num" value="${a.dur}" ${dis}><span class="u">horas</span></div></div></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap"><label class="sw" title="Sin resultado no deja cerrar la OT"><input type="checkbox" data-b="${bp('oblig')}" ${a.oblig ? 'checked' : ''} ${dis}><i></i>Obligatoria</label><label class="sw"><input type="checkbox" data-b="${bp('parada')}" ${a.parada ? 'checked' : ''} ${dis}><i></i>Requiere parada</label><label class="sw"><input type="checkbox" data-b="${bp('perm')}" ${a.perm ? 'checked' : ''} ${dis}><i></i>Requiere permiso de trabajo</label></div>

/* ------------------------------------------------------------ CUMPLIMIENTO */
function cumData() {

  const g = (arr, key) => { const m = {}; arr.forEach(x => { const k = key(x); (m[k] = m[k] || []).push(x); }); return Object.entries(m).map(([k, xs]) => ({ k, xs, n: xs.length, c: xs.filter(x => x.otS === 'c').length, w: xs.filter(x => x.ot && x.otS !== 'c').length, v: xs.filter(x => !x.ot).length })).map(o => Object.assign(o, { pc: Math.round(o.c / o.n * 100) })).sort((a, b) => a.pc - b.pc); };
  return { due, byPlan: g(due, x => x.plan), byEq: g(due, x => x.eq) };
}
function cumHTML() {
  const { due, byPlan, byEq } = cumData(), c = due.filter(x => x.otS === 'c').length, pc = due.length ? Math.round(c / due.length * 100) : 0;

  const tbl = (rows, kind) => `<div class="rows">${rows.map(o => { const nm = kind === 'plan' ? planById(o.k).n : asset(o.k).n; return `<div class="rw click" style="grid-template-columns:minmax(0,1fr) 120px 46px 62px" data-a="cumdet" data-kind="${kind}" data-v="${o.k}" role="button" tabindex="0"><span class="s"><b>${esc2(nm)}</b><small>${o.k} · ${o.c} de ${o.n} cumplidas${o.v ? ` · <span style="color:var(--red)">${o.v} sin OT</span>` : ''}${o.w ? ` · ${o.w} en espera de cierre` : ''}</small></span><span class="mbar"><i class="${o.pc < 90 ? 'low' : ''}" style="width:${o.pc}%"></i></span><b class="tn" style="text-align:right;${o.pc < 90 ? 'color:var(--amber)' : ''}">${o.pc} %</b><span style="text-align:right">${ic('chev', 15)}</span></div>`; }).join('') || '<div class="empty">Sin ejecuciones vencidas en el período.</div>'}</div>`;
  return `<div class="kp">${kc('', 'trend', cumY + ' %', 'Cumplimiento del año', 'Meta 90 %')}${kc(pc < 90 ? 'r' : 'c', 'check', pc + ' %', 'Últimos 40 días', `${c} de ${due.length} ejecuciones`)}${kc(venc ? 'r' : '', 'alert', venc, 'Vencidas sin OT', 'Restan al cumplimiento')}${kc('p', 'calw', rep, 'Reprogramadas', 'Se miden contra la fecha original')}</div>

function newPlanId() { return 'PLN-' + String(Math.max(26, ...PLANS.map(p => +p.id.slice(4))) + 1).padStart(4, '0'); }

  const p = Object.assign({ id: newPlanId(), n: '', pl: U.planta === 'all' ? 'ren' : U.planta, tipo: '', mod: '', st: 'draft', ver: 1, since: null, by: null, eqs: [], ints: [], hist: [[1, 'Borrador', null, 'Valentina Rojas', 'Creado hoy']] }, o);

}
