<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha del lead en cada etapa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 4536px; height: 1100px; box-sizing: border-box; padding-top: 30px; background: #FFFFFF; color: #17223B; font-family: Sora, 'Segoe UI', system-ui, sans-serif; display: grid; grid-template-columns: repeat(7, 600px); gap: 0 56px">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">1 · Lead calificado → Crear demo</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="lead" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">2 · Demo activa → Crear propuesta</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="demo" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">3 · Propuesta enviada → Generar contrato</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="propuesta" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">4 · Contrato visualizado → Reenviar para firma</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="contrato" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">5 · Cliente: firmado y pagado</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="cliente" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">6 · Marcar perdido (motivo en línea)</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="demo" marcando="{{true}}" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">7 · Perdido → Reabrir lead</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="Ficha" etapa="perdido" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4536,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
