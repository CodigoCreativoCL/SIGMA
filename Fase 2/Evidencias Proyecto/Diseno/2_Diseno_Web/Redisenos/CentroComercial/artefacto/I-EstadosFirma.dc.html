<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estados de la firma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1160px; box-sizing: border-box; padding: 32px; background: #FFFFFF; color: #17223B; font-family: Sora, 'Segoe UI', system-ui, sans-serif; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 32px">
  <sc-for list="{{estados}}" as="e" hint-placeholder-count="4">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700">
        <span style="{{e.chSt}}">{{e.k}}</span>{{e.t}}
      </figcaption>
      <div style="height: 480px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden">
        <dc-import name="Firma" estado="{{e.v}}" min-h="480px" hint-size="672px,480px"></dc-import>
      </div>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (bg, fg) => 'display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .03em; background: ' + bg + '; color: ' + fg + ';';
    return {
      estados: [
        { v: 'firmado', k: 'FIRMADO', t: 'Firma exitosa · copia enviada por correo', chSt: chip('#E8F6EF', '#12704C') },
        { v: 'vencido', k: 'VENCIDO', t: 'Enlace vencido · pedir uno nuevo', chSt: chip('#FFF3E4', '#9A4E00') },
        { v: 'usado', k: 'YA USADO', t: 'El contrato ya fue firmado', chSt: chip('#EAF4FF', '#0565C2') },
        { v: 'invalido', k: 'INVÁLIDO', t: 'Token inexistente o incompleto', chSt: chip('#FDEDEB', '#A92C23') }
      ]
    };
  }
}
</script>
</body>
</html>
