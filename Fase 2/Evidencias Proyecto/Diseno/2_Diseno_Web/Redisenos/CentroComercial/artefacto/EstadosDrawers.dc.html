  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">Pago · informar transferencia</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="DPago" modo="informar" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">Pago · corregir</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="DPago" modo="corregir" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><figcaption style="font-size: 14px; font-weight: 700">Pago · en línea con Webpay (solo lectura)</figcaption><div style="width: 600px; height: 1000px; border-radius: 14px; border: 1px solid #E2E7F0; overflow: hidden"><dc-import name="DPago" modo="webpay" ancho="600px" alto="1000px" hint-size="600px,1000px"></dc-import></div></figure>
