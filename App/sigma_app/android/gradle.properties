# 4G/2G es el valor de la plantilla de Flutter. Estaba en 8G/4G: en un equipo
# de 16 GB el daemon de Gradle y el de Kotlin se pisan, el build muere a medio
# escribir sus intermediates y Gradle falla con errores que parecen otra cosa
# ("Cannot load processed manifest files", "Failed to read zip file libs.jar").
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
