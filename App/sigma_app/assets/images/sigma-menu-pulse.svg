<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="title desc">
  <title id="title">Indicador pulsante SIGMA</title>
  <desc id="desc">Indicador animado de actividad para el menú de navegación.</desc>
  <defs>
    <linearGradient id="sigma-menu-gradient" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E0C2"/>
      <stop offset="0.42" stop-color="#2563EB"/>
      <stop offset="0.72" stop-color="#6C5CFF"/>
      <stop offset="1" stop-color="#FF4D9D"/>
    </linearGradient>
    <radialGradient id="sigma-menu-core" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#00E0C2"/>
      <stop offset="0.72" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6C5CFF"/>
    </radialGradient>
    <filter id="sigma-menu-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <style>
    .sigma-menu-ring {
      transform-box: view-box;
      transform-origin: 12px 12px;
      animation: sigma-menu-pulse 1.9s cubic-bezier(.2,.7,.35,1) infinite;
    }
    .sigma-menu-ring--delay { animation-delay: .65s; }
    .sigma-menu-node { animation: sigma-menu-breathe 1.9s ease-in-out infinite; }
    @keyframes sigma-menu-pulse {
      0% { opacity: .78; transform: scale(.44); stroke-width: 2.2px; }
      72%, 100% { opacity: 0; transform: scale(1); stroke-width: .8px; }
    }
    @keyframes sigma-menu-breathe {
      0%, 100% { transform: scale(.92); }
      50% { transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sigma-menu-ring, .sigma-menu-node { animation: none; }
      .sigma-menu-ring { opacity: .24; transform: scale(.82); }
    }
  </style>
  <circle cx="12" cy="12" r="6.4" fill="#00E0C2" opacity=".18" filter="url(#sigma-menu-glow)"/>
  <circle class="sigma-menu-ring" cx="12" cy="12" r="9" fill="none" stroke="url(#sigma-menu-gradient)"/>
  <circle class="sigma-menu-ring sigma-menu-ring--delay" cx="12" cy="12" r="9" fill="none" stroke="url(#sigma-menu-gradient)"/>
  <g class="sigma-menu-node" style="transform-box:view-box;transform-origin:12px 12px">
    <circle cx="12" cy="12" r="4.25" fill="url(#sigma-menu-core)"/>
    <circle cx="10.7" cy="10.5" r="1.05" fill="#FFFFFF" opacity=".9"/>
  </g>
</svg>
