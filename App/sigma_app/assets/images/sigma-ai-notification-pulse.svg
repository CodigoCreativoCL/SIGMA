<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Notificación de SIGMA AI</title>
  <desc id="desc">Símbolo neuronal animado para predicciones y recomendaciones de SIGMA AI.</desc>
  <defs>
    <linearGradient id="sigma-ai-alert-gradient" x1="5" y1="4" x2="27" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E0C2"/>
      <stop offset="0.42" stop-color="#2563EB"/>
      <stop offset="0.72" stop-color="#6C5CFF"/>
      <stop offset="1" stop-color="#FF4D9D"/>
    </linearGradient>
    <radialGradient id="sigma-ai-alert-core" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.32" stop-color="#00E0C2"/>
      <stop offset="0.7" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6C5CFF"/>
    </radialGradient>
  </defs>
  <style>
    .sigma-ai-alert-ring {
      transform-box: view-box;
      transform-origin: 16px 16px;
      animation: sigma-ai-alert-pulse 2.2s cubic-bezier(.2,.7,.35,1) infinite;
    }
    .sigma-ai-alert-ring--delay { animation-delay: .75s; }
    .sigma-ai-alert-network { animation: sigma-ai-alert-breathe 2.2s ease-in-out infinite; transform-origin:16px 16px; }
    @keyframes sigma-ai-alert-pulse {
      0% { opacity: .65; transform: scale(.3); stroke-width: 1.8px; }
      76%, 100% { opacity: 0; transform: scale(1); stroke-width: .6px; }
    }
    @keyframes sigma-ai-alert-breathe {
      0%, 100% { opacity: .88; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sigma-ai-alert-ring, .sigma-ai-alert-network { animation: none; }
      .sigma-ai-alert-ring { opacity: .18; }
    }
  </style>
  <circle class="sigma-ai-alert-ring" cx="16" cy="16" r="14" fill="none" stroke="url(#sigma-ai-alert-gradient)"/>
  <circle class="sigma-ai-alert-ring sigma-ai-alert-ring--delay" cx="16" cy="16" r="14" fill="none" stroke="url(#sigma-ai-alert-gradient)"/>
  <g class="sigma-ai-alert-network" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 16 7.5 7.5M16 16l9.5-4.5M16 16l-5 10" stroke="url(#sigma-ai-alert-gradient)" stroke-width="2.1"/>
    <circle cx="16" cy="16" r="3.7" fill="url(#sigma-ai-alert-core)" stroke="#FFFFFF" stroke-width="1.15"/>
    <circle cx="7.5" cy="7.5" r="2.7" fill="#080C17" stroke="#00E0C2" stroke-width="1.8"/>
    <circle cx="25.5" cy="11.5" r="2.7" fill="#080C17" stroke="#FF4D9D" stroke-width="1.8"/>
    <circle cx="11" cy="26" r="2.7" fill="#080C17" stroke="#6C5CFF" stroke-width="1.8"/>
  </g>
</svg>
