<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#6C5CFF" stroke-width="1.9"
     stroke-linecap="round" stroke-linejoin="round" role="img"
     aria-label="Abrir el calendario">

  <!-- El cuerpo del calendario. Esquinas redondeadas de 2.5 para que
       acompañe el radio de 12px de los campos y botones del producto: un
       icono de esquinas vivas al lado de un input redondeado se ve pegado
       de otro juego. -->
  <rect x="3" y="5" width="18" height="16" rx="2.5" />

  <!-- Las dos anillas. Son lo que hace que se lea como calendario y no
       como una tabla o una ventana, incluso a 16px. -->
  <path d="M8 3v4M16 3v4" />

  <!-- La línea del encabezado, que separa el mes de los días. -->
  <path d="M3 10h18" />

  <!-- Un día marcado. A este tamaño no caben los treinta, y uno solo basta
       para que el ojo complete el resto. Va relleno y sin trazo para que no
       se empaste con la retícula. -->
  <rect x="7" y="13" width="3.2" height="3.2" rx="0.8"
        fill="#6C5CFF" stroke="none" />
</svg>
